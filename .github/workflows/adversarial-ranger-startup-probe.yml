name: Ranger first-key diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Build unchanged runner and acquire pinned owned Ranger
        run: |
          go build -trimpath -o bin/playtestr ./cmd/playtestr
          python scripts/acceptance/adversarial_setup_python.py --project ranger
      - name: Observe actual numeric getch events with weak and stronger startup checkpoints
        run: python scripts/acceptance/adversarial_ranger_startup_probe.py
      - name: Verify restored source and remove owned diagnostic target
        if: always()
        run: python scripts/acceptance/adversarial_cleanup_unix.py --project ranger
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: adversarial-ranger-startup-probe-macos-15
          path: |
            artifacts/ten-new-project-adversarial-pass/**
            docs/validation/ten-new-project-adversarial-pass/attempts-v2.jsonl
            docs/validation/ten-new-project-adversarial-pass/identities
          if-no-files-found: error
          retention-days: 14
