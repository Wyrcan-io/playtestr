# Generated by playtestr workflow. Review commands; no service secrets required.
name: Runner readiness delivered free CI
on:
  push:
    branches: [work/p0-p2-implementation]
    paths: ['.github/workflows/runner-readiness-delivered-ci.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Actual real-target success, saved-extra fault or clean recovery
        type: choice
        options: [success, corruption, recovery]
        default: success
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  GOTOOLCHAIN: local
  GOTELEMETRY: 'off'
  GOENV: 'off'
  GOWORK: 'off'
  CGO_ENABLED: '0'
  GOMAXPROCS: '2'
  GOMEMLIMIT: 2GiB
  HOME: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/ci/home
  USERPROFILE: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/ci/home
  XDG_CACHE_HOME: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/ci/cache
  TEMP: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/ci/tmp
  TMP: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/ci/tmp
  TMPDIR: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/ci/tmp
  GOCACHE: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/ci/go-cache
  GOPATH: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/ci/gopath
  GOMODCACHE: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/ci/gopath/pkg/mod
  PIP_CACHE_DIR: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/ci/pip-cache
  PYTHONUSERBASE: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/ci/python-user
  GIT_CONFIG_NOSYSTEM: '1'
  GIT_CONFIG_GLOBAL: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/ci/home/gitconfig
  READINESS_IDENTITY_CATALOG_PROJECT: rclone
  PLAYTESTR_CI_MODE: ${{ inputs.mode }}
concurrency:
  group: playtestr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  terminal:
    if: github.event_name == 'workflow_dispatch'
    name: Playtestr tests (${{ matrix.os }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare campaign-owned caches before checkout and SDK actions
        run: |
          owned="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass"
          mkdir -p "$owned/ci/home" "$owned/ci/cache" "$owned/ci/tmp" "$owned/ci/tool-cache" "$owned/ci/go-cache" "$owned/ci/gopath/pkg/mod" "$owned/ci/pip-cache" "$owned/ci/python-user"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Wyrcan-io/playtestr
          ref: '129b7a45c0006be550f798ce52c2fbbfd327e515'
          path: .playtestr-tooling
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - name: Restore owned cache directories after initial checkout initialization
        run: |
          owned="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass"
          mkdir -p "$owned/ci/home" "$owned/ci/cache" "$owned/ci/tmp" "$owned/ci/tool-cache" "$owned/ci/go-cache" "$owned/ci/gopath/pkg/mod" "$owned/ci/pip-cache" "$owned/ci/python-user" artifacts/playtestr
      - name: Verify official Go 1.25 SDK in the owned checkout using installed Python
        run: |
          python3 scripts/acceptance/readiness_check.py --label delivered-ci-owned-runner-sdk --timeout 360 -- python3 scripts/acceptance/readiness_bootstrap_go.py
          echo "$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/toolchain/go/bin" >> "$GITHUB_PATH"
      - name: Build exact candidate runner
        id: setup
        env:
          SOURCE_REVISION: '129b7a45c0006be550f798ce52c2fbbfd327e515'
        run: |
          mkdir -p .playtestr-bin
          ext=''
          if [ "$RUNNER_OS" = Windows ]; then ext='.exe'; fi
          cd .playtestr-tooling
          go build -trimpath -ldflags "-X github.com/Wyrcan-io/playtestr/internal/buildinfo.Version=source-$SOURCE_REVISION" -o "$GITHUB_WORKSPACE/.playtestr-bin/playtestr$ext" ./cmd/playtestr
          cd "$GITHUB_WORKSPACE"
          echo "PLAYTESTR_BIN=$GITHUB_WORKSPACE/.playtestr-bin/playtestr$ext" >> "$GITHUB_ENV"
          test "$(".playtestr-bin/playtestr$ext" --version)" = "playtestr source-$SOURCE_REVISION"
      - name: Explicit target build
        id: prepare
        run: |
          python scripts/acceptance/readiness_delivered_ci_target.py --phase prepare --mode "$PLAYTESTR_CI_MODE"
      - name: Select committed suite and capture exact context
        id: context
        run: |
          mkdir -p artifacts/playtestr
          "$PLAYTESTR_BIN" test --list 'artifacts/runner-readiness-ten-project-pass/rclone/host-contracts/N02.json' > artifacts/playtestr/selected.txt
          python .playtestr-tooling/scripts/ci/context_manifest.py --selection artifacts/playtestr/selected.txt --runner "$PLAYTESTR_BIN" --output artifacts/playtestr/context.json
      - name: Test recorded interactions
        id: tests
        run: |
          "$PLAYTESTR_BIN" test --artifacts-dir artifacts/playtestr/evidence --report artifacts/playtestr/results.json 'artifacts/runner-readiness-ten-project-pass/rclone/host-contracts/N02.json'
      - name: Render offline evidence
        id: html
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          "$PLAYTESTR_BIN" report --input artifacts/playtestr/results.json --evidence-root artifacts/playtestr --output artifacts/playtestr/report.html
      - name: Verify real target restoration, preserve provenance and remove owned source/runtime
        if: always() && steps.prepare.outcome == 'success'
        run: python scripts/acceptance/readiness_delivered_ci_target.py --phase finalize --mode "$PLAYTESTR_CI_MODE"
      - name: Accessible outcome summary
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          HTML_OUTCOME: ${{ steps.html.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f .playtestr-tooling/scripts/ci/report_summary.py ]; then
            python .playtestr-tooling/scripts/ci/report_summary.py --input artifacts/playtestr/results.json --output "$GITHUB_STEP_SUMMARY" --evidence-root artifacts/playtestr --setup-outcome "$SETUP_OUTCOME" --prepare-outcome "$PREPARE_OUTCOME" --test-outcome "$TEST_OUTCOME" --html-outcome "$HTML_OUTCOME" --artifact-name "playtestr-${RUNNER_OS}" --run-url "$RUN_URL" --context artifacts/playtestr/context.json
          else
            echo '**Playtestr evidence unavailable: setup/helper missing; test success is not established.**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: playtestr-${{ runner.os }}
          path: artifacts/playtestr/
          if-no-files-found: error
          retention-days: 14
