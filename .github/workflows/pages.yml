name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'schema/**'
      - 'README.md'
      - 'SUPPORT.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'scripts/check-site.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'schema/**'
      - 'README.md'
      - 'SUPPORT.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'scripts/check-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.164.0'
  HUGO_LINUX_AMD64_SHA256: 'd9c8b17285ea4ec004d9f814273ea910f2051ce02c284993fd1f91ba455ae50d'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Hugo
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/hugo.tar.gz"
          install_dir="$RUNNER_TEMP/hugo"
          curl --fail --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "$archive"
          echo "${HUGO_LINUX_AMD64_SHA256}  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" hugo
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Build website
        run: hugo --source . --config site/hugo.toml --cleanDestinationDir --minify
      - name: Stage public schemas
        shell: bash
        run: |
          mkdir -p public/schema
          cp schema/*.json public/schema/
      - name: Validate generated website
        run: node scripts/check-site.mjs public
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed website artifact
        id: deployment
        uses: actions/deploy-pages@v4
