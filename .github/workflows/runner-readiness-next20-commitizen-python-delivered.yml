# Generated by playtestr workflow. Review commands; no service secrets required.
name: Next twenty commitizen-python delivered CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [work/p0-p2-implementation]
    paths: ['.github/workflows/runner-readiness-next20-commitizen-python-delivered.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [baseline, fault, recovered]
      route:
        type: choice
        required: true
        options: [source, private-archive]
permissions:
  contents: read
  actions: read
concurrency:
  group: playtestr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  JRNLCI_MODE: ${{ inputs.mode }}
  JRNLCI_ROUTE: ${{ inputs.route }}
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  PSModuleAnalysisCachePath: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/shell-cache/module-analysis
  GOCACHE: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/go-cache
  GOMODCACHE: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/gopath/pkg/mod
jobs:
  terminal:
    if: github.event_name == 'workflow_dispatch'
    name: Playtestr tests (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Wyrcan-io/playtestr
          ref: '294d6e42f6c0965a4e090aa11835941984d32a0a'
          path: .playtestr-tooling
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .playtestr-tooling/go.mod
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Build exact candidate runner
        id: setup
        env:
          SOURCE_REVISION: '294d6e42f6c0965a4e090aa11835941984d32a0a'
        run: |
          mkdir -p .playtestr-bin
          ext=''
          if [ "$RUNNER_OS" = Windows ]; then ext='.exe'; fi
          cd .playtestr-tooling
          go build -trimpath -ldflags "-X github.com/Wyrcan-io/playtestr/internal/buildinfo.Version=source-$SOURCE_REVISION" -o "$GITHUB_WORKSPACE/.playtestr-bin/playtestr$ext" ./cmd/playtestr
          cd "$GITHUB_WORKSPACE"
          echo "PLAYTESTR_BIN=$GITHUB_WORKSPACE/.playtestr-bin/playtestr$ext" >> "$GITHUB_ENV"
          test "$(".playtestr-bin/playtestr$ext" --version)" = "playtestr source-$SOURCE_REVISION"
      - name: Explicit target prerequisites
        run: |
          mkdir -p artifacts/runner-readiness-next-twenty-project-pass/tmp artifacts/runner-readiness-next-twenty-project-pass/shell-cache
      - name: Explicit target build
        id: prepare
        run: |
          python -B scripts/acceptance/next20_check.py --label delivered-commitizen-python-reviewed-target-preparation --timeout 1200 -- python -B scripts/acceptance/next20_python_ci.py prepare
      - name: Select committed suite and capture exact context
        id: context
        run: |
          mkdir -p artifacts/playtestr
          "$PLAYTESTR_BIN" test --list 'artifacts/runner-readiness-next-twenty-project-pass/commitizen-python/host-contracts/normal-init-portable.json' > artifacts/playtestr/selected.txt
          python .playtestr-tooling/scripts/ci/context_manifest.py --selection artifacts/playtestr/selected.txt --runner "$PLAYTESTR_BIN" --output artifacts/playtestr/context.json
      - name: Test recorded interactions
        id: tests
        run: |
          "$PLAYTESTR_BIN" test --artifacts-dir artifacts/playtestr/evidence --report artifacts/playtestr/results.json 'artifacts/runner-readiness-next-twenty-project-pass/commitizen-python/host-contracts/normal-init-portable.json'
      - name: Render offline evidence
        id: html
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          "$PLAYTESTR_BIN" report --input artifacts/playtestr/results.json --evidence-root artifacts/playtestr --output artifacts/playtestr/report.html
      - name: Accessible outcome summary
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          HTML_OUTCOME: ${{ steps.html.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f .playtestr-tooling/scripts/ci/report_summary.py ]; then
            python .playtestr-tooling/scripts/ci/report_summary.py --input artifacts/playtestr/results.json --output "$GITHUB_STEP_SUMMARY" --evidence-root artifacts/playtestr --setup-outcome "$SETUP_OUTCOME" --prepare-outcome "$PREPARE_OUTCOME" --test-outcome "$TEST_OUTCOME" --html-outcome "$HTML_OUTCOME" --artifact-name "playtestr-${RUNNER_OS}" --run-url "$RUN_URL" --context artifacts/playtestr/context.json
          else
            echo '**Playtestr evidence unavailable: setup/helper missing; test success is not established.**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: playtestr-${{ runner.os }}
          path: artifacts/playtestr/
          if-no-files-found: error
          retention-days: 14
      - name: Restore actual source and checked-remove owned target
        if: always() && steps.prepare.outcome == 'success' && steps.tests.outcome != 'skipped'
        run: python -B scripts/acceptance/next20_check.py --label delivered-commitizen-python-checked-restoration-cleanup --timeout 900 -- python -B scripts/acceptance/next20_python_ci.py cleanup
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: next20-commitizen-python-delivered-${{ runner.os }}
          path: |
            artifacts/runner-readiness-next-twenty-project-pass/commitizen-python/delivered-ci/
            artifacts/runner-readiness-next-twenty-project-pass/commitizen-python/host-contracts/
            artifacts/runner-readiness-next-twenty-project-pass/commitizen-python/process-proof.json
            artifacts/runner-readiness-next-twenty-project-pass/commitizen-python/retained-source/*.json
            artifacts/runner-readiness-next-twenty-project-pass/commitizen-python/*/console.log
            artifacts/runner-readiness-next-twenty-project-pass/core/
            artifacts/runner-readiness-next-twenty-project-pass/candidate/*/installed.json
            artifacts/runner-readiness-next-twenty-project-pass/events/
            artifacts/runner-readiness-next-twenty-project-pass/identities/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
