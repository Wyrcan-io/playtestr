name: Next twenty readiness harness
on:
  push:
    branches: [work/p0-p2-implementation]
    paths:
      - '.github/workflows/runner-readiness-next20-harness.yml'
      - 'scripts/acceptance/next20_*.py'
      - 'scripts/acceptance/test_next20_*.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playtestr-next20-harness
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
jobs:
  native-adapter:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Check helper syntax and real bounded command controls
        shell: bash
        run: |
          python -B scripts/acceptance/next20_check.py --label native-next20-syntax --timeout 60 -- python -B -c "import ast,pathlib; files=list(pathlib.Path('scripts/acceptance').glob('next20_*.py')); [ast.parse(p.read_text(encoding='utf-8-sig'),filename=str(p)) for p in files]; print('Parsed',len(files),'next20 helpers')"
          python -B scripts/acceptance/next20_check.py --label native-next20-command-controls --timeout 240 -- python -B -m unittest discover -s scripts/acceptance -p 'test_next20_*.py' -v
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: next20-harness-${{ matrix.os }}
          path: |
            artifacts/runner-readiness-next-twenty-project-pass/core/
            artifacts/runner-readiness-next-twenty-project-pass/events/
            artifacts/runner-readiness-next-twenty-project-pass/identities/
            artifacts/runner-readiness-next-twenty-project-pass/control-tests/
          if-no-files-found: error
          retention-days: 14
