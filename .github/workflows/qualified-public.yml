name: Qualified public distribution and upgrade verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Qualified embedded version to verify after publication
        required: true
        type: string

permissions:
  contents: read

env:
  # Retained native failure evidence includes paths beyond MAX_PATH.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"
  RELEASE_VERSION: ${{ inputs.version }}
  ACTION_REVISION: ae97c62022966cde9699b26169b4dc6ef0a12439

jobs:
  identities:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib
          records=json.loads(pathlib.Path('release/wide-character-candidate-manifest.json').read_text())
          assert len(records)==3
          hosts={'linux':('ubuntu-24.04','amd64'),'darwin':('macos-15','arm64'),'windows':('windows-latest','amd64')}
          rows=[]
          for r in records:
              assert r['version']==os.environ['RELEASE_VERSION']
              name=pathlib.Path(r['archive']).name
              target=next(h for h in hosts if '_'+h+'_' in name)
              host,arch=hosts[target]
              rows.append(dict(runner=host,target_os=target,target_arch=arch,executable='playtestr.exe' if target=='windows' else 'playtestr',archive=name,archive_sha256=r['archive_sha256'],binary_sha256=r['executable_sha256']))
          assert len({r['target_os'] for r in rows})==3
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('matrix='+json.dumps(dict(include=rows))+'\n')
          PY
  public-behavior:
    needs: identities
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identities.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
      - name: Install through immutable public action
        id: setup
        uses: Wyrcan-io/playtestr/setup-playtestr@ae97c62022966cde9699b26169b4dc6ef0a12439
        with:
          version: ${{ inputs.version }}
      - name: Verify action identities and PATH
        shell: bash
        env:
          BINARY_PATH: ${{ steps.setup.outputs.binary-path }}
          ARCHIVE_SHA256: ${{ steps.setup.outputs.archive-sha256 }}
          BINARY_SHA256: ${{ steps.setup.outputs.binary-sha256 }}
        run: |
          set -euo pipefail
          test "$ARCHIVE_SHA256" = '${{ matrix.archive_sha256 }}'
          test "$BINARY_SHA256" = '${{ matrix.binary_sha256 }}'
          binary_for_shell="$BINARY_PATH"
          if [[ '${{ matrix.target_os }}' == windows ]]; then
            binary_for_shell="$(cygpath -u "$BINARY_PATH")"
          fi
          test "$(sha256sum "$binary_for_shell" | awk '{print $1}')" = '${{ matrix.binary_sha256 }}'
          test "$("$binary_for_shell" version)" = "playtestr $RELEASE_VERSION"
          test "$(playtestr version)" = "playtestr $RELEASE_VERSION"
      - name: Download and extract public archive into spaced path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'artifacts/public download/path with spaces'
          base="https://github.com/Wyrcan-io/playtestr/releases/download/$RELEASE_VERSION"
          archive='artifacts/public download/${{ matrix.archive }}'
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 --max-filesize 67108864 --silent --show-error \
            --write-out 'status=%{http_code} size=%{size_download} seconds=%{time_total}\n' \
            "$base/${{ matrix.archive }}" --output "$archive" \
            > 'artifacts/public download/download.txt'
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 --max-filesize 67108864 --silent --show-error \
            "$base/checksums-$RELEASE_VERSION.txt" \
            --output "artifacts/public download/checksums-$RELEASE_VERSION.txt"
          test "$(sha256sum "$archive" | awk '{print $1}')" = '${{ matrix.archive_sha256 }}'
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 --max-filesize 65536 --silent --show-error \
            "$base/${{ matrix.archive }}.sha256" --output "$archive.sha256"
          # Compare immutable Git blob bytes, unaffected by Windows checkout CRLF.
          git show "HEAD:release/checksums-$RELEASE_VERSION.txt" > 'artifacts/public download/expected-checksums.txt'
          cmp "artifacts/public download/checksums-$RELEASE_VERSION.txt" 'artifacts/public download/expected-checksums.txt'
          printf '%s  %s\n' '${{ matrix.archive_sha256 }}' '${{ matrix.archive }}' > 'artifacts/public download/expected.sha256'
          cmp "$archive.sha256" 'artifacts/public download/expected.sha256'
          if [[ '${{ matrix.target_os }}' == windows ]]; then
            unzip -q "$archive" -d 'artifacts/public download/path with spaces'
          else
            tar -xzf "$archive" -C 'artifacts/public download/path with spaces'
          fi
          extracted="$(find 'artifacts/public download/path with spaces' -name '${{ matrix.executable }}' -type f)"
          test -n "$extracted"
          test "$(sha256sum "$extracted" | awk '{print $1}')" = '${{ matrix.binary_sha256 }}'
          test "$("$extracted" version)" = "playtestr $RELEASE_VERSION"
          python - "$extracted" <<'PY'
          import os,pathlib,sys
          with open(os.environ['GITHUB_ENV'],'a') as output: output.write('PUBLIC_EXTRACTED='+str(pathlib.Path(sys.argv[1]).resolve())+'\n')
          PY
      - name: Build deterministic targets
        shell: bash
        run: |
          set -euo pipefail
          suffix=''
          if [[ '${{ matrix.target_os }}' == windows ]]; then suffix='.exe'; fi
          go build -trimpath -o "bin/demo$suffix" ./cmd/demo
          go build -trimpath -o "bin/fixture$suffix" ./cmd/fixture
      - name: Public real application pass intended failure recovery and offline report
        shell: bash
        env:
          PUBLIC_RUNNER: ${{ steps.setup.outputs.binary-path }}
          GOBIN: ${{ github.workspace }}/.tools/external
        run: |
          set -euo pipefail
          go install github.com/charmbracelet/gum@v0.17.0
          mkdir -p artifacts/public-real
          "$PUBLIC_EXTRACTED" test --report artifacts/public-real/pass.json corpus/workflows/gum/gum-01.json
          set +e
          "$PUBLIC_EXTRACTED" test --report artifacts/public-real/failure.json --artifacts-dir artifacts/public-real/evidence corpus/pilots/gum-01-negative.json
          code=$?
          set -e
          test "$code" -eq 1
          "$PUBLIC_EXTRACTED" test --report artifacts/public-real/recovery.json corpus/workflows/gum/gum-01.json
          "$PUBLIC_EXTRACTED" report --input artifacts/public-real/failure.json --evidence-root artifacts --output artifacts/public-real/report.html
          python - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path('artifacts/public-real')
          for name in ['pass','recovery']:
              r=json.loads((root/(name+'.json')).read_text())['results'][0]
              assert r['status']=='passed' and r['cleanup']['confirmed_exited'] and r['workspace']['cleaned']
          r=json.loads((root/'failure.json').read_text())['results'][0]
          assert r['failure']['category']=='snapshot_mismatch' and r['cleanup']['confirmed_exited']
          target=next(pathlib.Path('.tools/external').glob('gum*'))
          (root/'target.json').write_text(json.dumps(dict(version='v0.17.0',sha256=hashlib.sha256(target.read_bytes()).hexdigest(),negative='classified wrong input; not executable code defect')))
          PY
      - name: Public invalid input cancellation and controlling terminal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-prelaunch
          printf '{"version":99}' > artifacts/public-prelaunch/invalid.json
          set +e
          "$PUBLIC_EXTRACTED" test --report artifacts/public-prelaunch/invalid-result.json artifacts/public-prelaunch/invalid.json > artifacts/public-prelaunch/invalid.log 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('artifacts/public-prelaunch/invalid-result.json').read_text())['results'][0]
          assert r['failure']['category']=='invalid_spec' and not r['cleanup']['attempted']
          PY
          suffix=''; if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          python scripts/release-cancel-smoke.py "$PUBLIC_EXTRACTED" "$PWD/bin/fixture$suffix" "$PWD/artifacts/public-cancellation"
          if [[ "$RUNNER_OS" != Windows ]]; then
            mkdir -p artifacts/public-tty
            cp testdata/install-smoke/unix/controlling-tty.* artifacts/public-tty/
            chmod +x artifacts/public-tty/controlling-tty.sh
            (cd artifacts/public-tty && "$PUBLIC_EXTRACTED" test --report tty-result.json controlling-tty.json)
          fi
      - name: Run release stories and cleanup checks
        shell: bash
        env:
          PUBLIC_RUNNER: ${{ steps.setup.outputs.binary-path }}
        run: bash release/stories/run.sh "$PUBLIC_RUNNER" 'artifacts/public-stories'
      - name: Run v1, v2, mixed, expected-nonzero, and reports
        shell: bash
        env:
          PUBLIC_RUNNER: ${{ steps.setup.outputs.binary-path }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-contracts
          "$PUBLIC_RUNNER" test --report artifacts/public-contracts/v1.json examples/menu.json
          "$PUBLIC_RUNNER" report --input artifacts/public-contracts/v1.json --evidence-root . --output artifacts/public-contracts/v1.html
          "$PUBLIC_RUNNER" test --report artifacts/public-contracts/v2.json examples/workspace.json
          "$PUBLIC_RUNNER" report --input artifacts/public-contracts/v2.json --evidence-root . --output artifacts/public-contracts/v2.html
          "$PUBLIC_RUNNER" test --report artifacts/public-contracts/mixed.json examples/menu.json examples/workspace.json
          cat > artifacts/public-contracts/expected-nonzero.json <<'JSON'
          {
            "version": 1,
            "name": "Public expected nonzero",
            "command": ["pwsh", "-NoLogo", "-NoProfile", "-Command", "Write-Output 'expected nonzero ready'; exit 7"],
            "steps": [{"expect": "expected nonzero ready"}, {"exit": 7}]
          }
          JSON
          "$PUBLIC_RUNNER" test --report artifacts/public-contracts/expected-nonzero-result.json artifacts/public-contracts/expected-nonzero.json
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('artifacts/public-contracts')
          for name in ('v1', 'v2', 'mixed', 'expected-nonzero-result'):
              data = json.loads((root / f'{name}.json').read_text(encoding='utf-8'))
              assert data['summary']['failed'] == 0, (name, data)
          assert json.loads((root / 'v1.json').read_text())['report_version'] == 1
          assert json.loads((root / 'v2.json').read_text())['report_version'] == 2
          assert json.loads((root / 'mixed.json').read_text())['report_version'] == 2
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: public-verification-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: |
            artifacts/public download/download.txt
            artifacts/public-stories/
            artifacts/public-contracts/
            artifacts/public-real/
            artifacts/public-prelaunch/
            artifacts/public-cancellation/
            artifacts/public-tty/
            artifacts/public download/*.sha256
            artifacts/public download/checksums-*.txt
          if-no-files-found: error
          retention-days: 14

  upgrade:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target_os: linux
          - runner: macos-15
            target_os: darwin
          - runner: windows-latest
            target_os: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
      - name: Build v1 and v2 targets
        shell: bash
        run: |
          set -euo pipefail
          suffix=''
          if [[ '${{ matrix.target_os }}' == windows ]]; then suffix='.exe'; fi
          go build -trimpath -o "bin/demo$suffix" ./cmd/demo
          go build -trimpath -o "bin/fixture$suffix" ./cmd/fixture
          sha256sum examples/snapshots/diagnostics.txt > artifacts-baseline.sha256
      - name: Install old runner with the new immutable action
        id: old
        uses: Wyrcan-io/playtestr/setup-playtestr@ae97c62022966cde9699b26169b4dc6ef0a12439
        with:
          version: v0.3.0-rc.1
      - name: Exercise old v1 pass, failure, and recovery
        shell: bash
        env:
          OLD_RUNNER: ${{ steps.old.outputs.binary-path }}
        run: |
          set -euo pipefail
          test "$(playtestr version)" = 'playtestr v0.3.0-rc.1'
          "$OLD_RUNNER" test --report old-pass.json examples/menu.json
          set +e
          "$OLD_RUNNER" test --report old-failure.json examples/snapshot-mismatch.json
          code=$?
          set -e
          test "$code" -eq 1
          "$OLD_RUNNER" test --report old-recovery.json examples/menu.json
      - name: Install new runner separately with the same action
        id: new
        uses: Wyrcan-io/playtestr/setup-playtestr@ae97c62022966cde9699b26169b4dc6ef0a12439
        with:
          version: ${{ inputs.version }}
      - name: Exercise new v1 path and v2-only path
        shell: bash
        env:
          OLD_RUNNER: ${{ steps.old.outputs.binary-path }}
          NEW_RUNNER: ${{ steps.new.outputs.binary-path }}
        run: |
          set -euo pipefail
          test "$OLD_RUNNER" != "$NEW_RUNNER"
          test "$(playtestr version)" = "playtestr $RELEASE_VERSION"
          "$NEW_RUNNER" test --report new-pass.json examples/menu.json
          set +e
          "$NEW_RUNNER" test --report new-failure.json examples/snapshot-mismatch.json
          code=$?
          set -e
          test "$code" -eq 1
          "$NEW_RUNNER" test --report new-recovery.json examples/menu.json
          "$NEW_RUNNER" test --report new-v2.json examples/workspace.json
          sha256sum --check --strict artifacts-baseline.sha256
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: public-upgrade-${{ matrix.target_os }}
          path: |
            old-*.json
            new-*.json
            artifacts-baseline.sha256
          if-no-files-found: warn
          retention-days: 14
