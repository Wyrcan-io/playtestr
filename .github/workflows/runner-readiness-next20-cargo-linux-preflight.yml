name: Next twenty cargo-generate native Linux preflight
on:
  push:
    branches: [work/p0-p2-implementation]
    paths: ['.github/workflows/runner-readiness-next20-cargo-linux-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: playtestr-next20-cargo-linux-preflight
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  TEMP: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp
  TMP: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp
  TMPDIR: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp
  PSModuleAnalysisCachePath: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/shell-cache/module-analysis
jobs:
  native-development:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Create owned temporary and cache paths
        run: mkdir -p "$GITHUB_WORKSPACE/artifacts/runner-readiness-next-twenty-project-pass/tmp" "$GITHUB_WORKSPACE/artifacts/runner-readiness-next-twenty-project-pass/shell-cache"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: Wyrcan-io/playtestr
          run-id: 40424475362
          name: next20-private-replacement-Linux
          path: artifacts/runner-readiness-next-twenty-project-pass/candidate-download
      - name: Install exact frozen native Linux archive
        run: python -B scripts/acceptance/next20_check.py --label cargo-linux-exact-archive --timeout 90 -- python -B scripts/acceptance/next20_candidate_install.py --series native-exit-v1 --archive artifacts/runner-readiness-next-twenty-project-pass/candidate-download/replacement-candidate/native-exit-v1/linux-amd64/dist/playtestr_0.4.0-rc.6_linux_amd64.tar.gz
      - name: Acquire, verify reviewed dependencies and compile ordinary CLI within twenty minutes
        run: python -B scripts/acceptance/next20_check.py --label cargo-linux-bounded-native-preparation --timeout 1200 -- python -B scripts/acceptance/next20_cargo_prepare.py
      - name: Retain exact actual compiled binary and provenance
        run: python -B scripts/acceptance/next20_check.py --label cargo-linux-binary-retention --timeout 240 -- python -B scripts/acceptance/next20_cargo_preflight_pack.py
      - name: Execute all twenty development scenarios on native Linux
        run: python -B scripts/acceptance/next20_check.py --label cargo-linux-twenty-native-development --timeout 1200 -- python -B scripts/acceptance/next20_jrnl_development.py --project cargo-generate --candidate-series native-exit-v1 --host-profile
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: next20-cargo-linux-preflight
          path: |
            artifacts/runner-readiness-next-twenty-project-pass/core/
            artifacts/runner-readiness-next-twenty-project-pass/events/
            artifacts/runner-readiness-next-twenty-project-pass/identities/
            artifacts/runner-readiness-next-twenty-project-pass/cargo-generate/
            artifacts/runner-readiness-next-twenty-project-pass/active/cargo-generate/*.json
            artifacts/runner-readiness-next-twenty-project-pass/active/cargo-generate/source.tar.gz
            artifacts/runner-readiness-next-twenty-project-pass/candidate-native-exit-v1/linux/installed.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
