# Reviewed campaign derivative: owned prerequisites; manual event; bounded extra faults and teardown.
# Generated by playtestr workflow. Review commands; no service secrets required.
name: Runner readiness Plop native
on:
  push:
    branches: [work/p0-p2-implementation]
    paths: ['.github/workflows/runner-readiness-plop.yml']
  workflow_dispatch:
env:
  SOURCE_REVISION: 'e7b5f29e575e44babe7fdaa2e83e55b62d318305'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  GOTOOLCHAIN: local
  TEMP: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/tmp
  TMP: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/tmp
  TMPDIR: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/tmp
  GOTMPDIR: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/tmp
  GOCACHE: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/go-cache
  GOPATH: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/gopath
  GOMODCACHE: ${{ github.workspace }}/artifacts/runner-readiness-ten-project-pass/gopath/pkg/mod
permissions:
  contents: read
concurrency:
  group: playtestr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  terminal:
    if: github.event_name == 'workflow_dispatch'
    name: Playtestr tests (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Wyrcan-io/playtestr
          ref: 'e7b5f29e575e44babe7fdaa2e83e55b62d318305'
          path: .playtestr-tooling
          persist-credentials: false
          set-safe-directory: false
      - name: Bootstrap official SDK only inside checkout
        run: |
          export PATH="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/toolchain/go/bin:$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/active/plop/bin:$PATH"
          mkdir -p "$TEMP" "$GOCACHE" "$GOPATH"
          python3 scripts/acceptance/readiness_check.py --label plop-native-sdk --timeout 360 -- python3 scripts/acceptance/readiness_bootstrap_go.py
      - name: Build exact candidate runner
        id: setup
        env:
          SOURCE_REVISION: 'e7b5f29e575e44babe7fdaa2e83e55b62d318305'
        run: |
          export PATH="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/toolchain/go/bin:$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/active/plop/bin:$PATH"
          mkdir -p .playtestr-bin
          ext=''
          if [ "$RUNNER_OS" = Windows ]; then ext='.exe'; fi
          cd .playtestr-tooling
          go build -trimpath -ldflags "-X github.com/Wyrcan-io/playtestr/internal/buildinfo.Version=source-$SOURCE_REVISION" -o "$GITHUB_WORKSPACE/.playtestr-bin/playtestr$ext" ./cmd/playtestr
          cd "$GITHUB_WORKSPACE"
          echo "PLAYTESTR_BIN=$GITHUB_WORKSPACE/.playtestr-bin/playtestr$ext" >> "$GITHUB_ENV"
          test "$(".playtestr-bin/playtestr$ext" --version)" = "playtestr source-$SOURCE_REVISION"
      - name: Explicit target build
        id: prepare
        run: |
          export PATH="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/toolchain/go/bin:$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/active/plop/bin:$PATH"
          python3 scripts/acceptance/readiness_plop_native_prepare.py
      - name: Select committed suite and capture exact context
        id: context
        run: |
          export PATH="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/toolchain/go/bin:$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/active/plop/bin:$PATH"
          mkdir -p artifacts/playtestr
          "$PLAYTESTR_BIN" test --list 'artifacts/runner-readiness-ten-project-pass/plop/host-contracts' > artifacts/playtestr/selected.txt
          python3 .playtestr-tooling/scripts/ci/context_manifest.py --selection artifacts/playtestr/selected.txt --runner "$PLAYTESTR_BIN" --output artifacts/playtestr/context.json
      - name: Test recorded interactions
        id: tests
        run: |
          export PATH="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/toolchain/go/bin:$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/active/plop/bin:$PATH"
          python3 scripts/acceptance/readiness_public_suite.py --project plop --selection artifacts/playtestr/selected.txt -- "$PLAYTESTR_BIN" test --artifacts-dir artifacts/playtestr/evidence --report artifacts/playtestr/results.json 'artifacts/runner-readiness-ten-project-pass/plop/host-contracts'
      - name: Render offline evidence
        id: html
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          export PATH="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/toolchain/go/bin:$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/active/plop/bin:$PATH"
          "$PLAYTESTR_BIN" report --input artifacts/playtestr/results.json --evidence-root artifacts/playtestr --output artifacts/playtestr/report.html
      - name: Accessible outcome summary
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          HTML_OUTCOME: ${{ steps.html.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export PATH="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/toolchain/go/bin:$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/active/plop/bin:$PATH"
          if [ -f .playtestr-tooling/scripts/ci/report_summary.py ]; then
            python3 .playtestr-tooling/scripts/ci/report_summary.py --input artifacts/playtestr/results.json --output "$GITHUB_STEP_SUMMARY" --evidence-root artifacts/playtestr --setup-outcome "$SETUP_OUTCOME" --prepare-outcome "$PREPARE_OUTCOME" --test-outcome "$TEST_OUTCOME" --html-outcome "$HTML_OUTCOME" --artifact-name "playtestr-${RUNNER_OS}" --run-url "$RUN_URL" --context artifacts/playtestr/context.json
          else
            echo '**Playtestr evidence unavailable: setup/helper missing; test success is not established.**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Real source faults and public maintenance
        if: always() && steps.context.outcome == 'success'
        run: |
          export PATH="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/toolchain/go/bin:$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/active/plop/bin:$PATH"
          python3 scripts/acceptance/readiness_check.py --label native-plop-faults-parent --timeout 900 -- python3 scripts/acceptance/readiness_plop_faults.py --package artifacts/runner-readiness-ten-project-pass/plop/host-contracts
          python3 scripts/acceptance/readiness_check.py --label native-plop-maintenance-parent --timeout 900 -- python3 scripts/acceptance/readiness_plop_maintenance.py --package artifacts/runner-readiness-ten-project-pass/plop/host-contracts
      - name: Verify retained source restore and remove owned target
        if: always() && steps.prepare.outcome == 'success'
        run: |
          export PATH="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/toolchain/go/bin:$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass/active/plop/bin:$PATH"
          python3 scripts/acceptance/readiness_check.py --label native-plop-cleanup-parent --timeout 120 -- python3 scripts/acceptance/readiness_cleanup_plop.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: playtestr-${{ runner.os }}
          path: |
            artifacts/playtestr/
            artifacts/runner-readiness-ten-project-pass/events/
            artifacts/runner-readiness-ten-project-pass/identities/
            artifacts/runner-readiness-ten-project-pass/core/
            artifacts/runner-readiness-ten-project-pass/plop/
            artifacts/runner-readiness-ten-project-pass/plop-native-runner.json
            artifacts/runner-readiness-ten-project-pass/toolchain/sdk.json
            !artifacts/runner-readiness-ten-project-pass/plop/retained-source/source.tar.gz
          if-no-files-found: error
          retention-days: 14
