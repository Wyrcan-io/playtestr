name: Terminal tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOBIN: ${{ github.workspace }}/.tools/external
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build -o bin/demo${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/demo
      - run: go build -o bin/fixture${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/fixture
      - run: go build -trimpath -ldflags "-X github.com/Wyrcan-io/playtestr/internal/buildinfo.Version=ci" -o bin/playtestr${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/playtestr
      - name: Install pinned external TUI
        run: go install github.com/charmbracelet/gum@v0.17.0
      - name: Run passing acceptance specs
        run: ./bin/playtestr${{ runner.os == 'Windows' && '.exe' || '' }} test --report artifacts/results.json examples/menu.json examples/menu-exit.json examples/silent-input.json examples/screen-compat.json examples/resize.json examples/external-gum.json
      - name: Run deliberate screen regression
        shell: bash
        run: |
          set +e
          ./bin/playtestr${{ runner.os == 'Windows' && '.exe' || '' }} test --report artifacts/expected-failure.json examples/snapshot-mismatch.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected snapshot mismatch exit code 1, got $code" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: terminal-evidence-${{ matrix.os }}
          path: |
            artifacts/*.json
            examples/*.actual.txt
            examples/*.diff.txt
          if-no-files-found: error
