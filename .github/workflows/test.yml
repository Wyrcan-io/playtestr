name: Terminal tests
on: [push, pull_request]

permissions:
  contents: read

env:
  # Retained native failure evidence includes paths beyond MAX_PATH.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"

jobs:
  test:
    # This authorized campaign uses the checkout-owned SDK/cache workflow.
    # Preserve the ordinary pipeline for other branches and PR merge refs.
    if: github.ref != 'refs/heads/work/p0-p2-implementation'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      GOBIN: ${{ github.workspace }}/.tools/external
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify evidence-tool failure controls
        run: python -m unittest discover -s scripts/readiness -p test_verify_evidence.py -v
      - name: Verify CI summary failure controls
        run: python -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Verify published prerelease installation and greeting documentation
        run: python scripts/website/install_doc_smoke.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: Native race checks
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export PATH="/c/msys64/mingw64/bin:/c/msys64/ucrt64/bin:$PATH"
            export CC=gcc
          fi
          export CGO_ENABLED=1
          go test -race -count=1 ./...
      - run: go build -o bin/demo${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/demo
      - run: go build -o bin/fixture${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/fixture
      - run: go build -trimpath -ldflags "-X github.com/Wyrcan-io/playtestr/internal/buildinfo.Version=ci" -o bin/playtestr${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/playtestr
      - name: Install pinned external TUI
        run: go install github.com/charmbracelet/gum@v0.17.0
      - name: Record, fresh replay, mutate target and recover
        env:
          PLAYTESTR_GUM: ${{ github.workspace }}/.tools/external/gum${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python scripts/acceptance/recorded_journey.py
      - name: Run passing acceptance specs
        run: |
          ./bin/playtestr${{ runner.os == 'Windows' && '.exe' || '' }} test --list examples/suite
          ./bin/playtestr${{ runner.os == 'Windows' && '.exe' || '' }} test --artifacts-dir artifacts/playtestr --report artifacts/suite-results.json examples/suite
          ./bin/playtestr${{ runner.os == 'Windows' && '.exe' || '' }} test --report artifacts/results.json examples/silent-input.json examples/screen-compat.json examples/resize.json examples/external-gum.json
      - name: Run deliberate screen regression
        shell: bash
        run: |
          set +e
          ./bin/playtestr${{ runner.os == 'Windows' && '.exe' || '' }} test --artifacts-dir artifacts/playtestr --report artifacts/expected-failure.json examples/snapshot-mismatch.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected snapshot mismatch exit code 1, got $code" >&2
            exit 1
          fi
          ./bin/playtestr${{ runner.os == 'Windows' && '.exe' || '' }} report --input artifacts/expected-failure.json --evidence-root artifacts --output artifacts/expected-failure.html
          grep --fixed-strings 'Playtestr offline report' artifacts/expected-failure.html
          grep --fixed-strings 'snapshot_mismatch' artifacts/expected-failure.html
          grep --fixed-strings 'Preview deployed successfully.' artifacts/expected-failure.html
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: terminal-evidence-${{ matrix.os }}
          path: |
            artifacts/*.json
            artifacts/*.html
            artifacts/playtestr/**
            artifacts/p0-p2-recorded/**
          if-no-files-found: error
          retention-days: 14
