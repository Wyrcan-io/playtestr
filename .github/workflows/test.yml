name: Terminal tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build -o bin/demo${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/demo
      - run: go build -o bin/fixture${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/fixture
      - run: go run ./cmd/playtestr test examples/menu.json examples/menu-exit.json examples/silent-input.json examples/screen-compat.json examples/resize.json
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: terminal-failure-${{ matrix.os }}
          path: |
            examples/*.actual.txt
            examples/*.diff.txt
          if-no-files-found: ignore
