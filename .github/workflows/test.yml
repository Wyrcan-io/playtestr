name: Terminal tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build -o bin/demo${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/demo
      - run: go build -o bin/fixture${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/fixture
      - run: go run ./cmd/playtestr test examples/menu.json examples/menu-exit.json examples/silent-input.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: terminal-failure-${{ matrix.os }}
          path: examples/*.actual.txt
