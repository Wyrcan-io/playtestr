name: Frozen candidate qualification

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Native release build run ID at this exact commit
        required: true
        type: string
      attempts:
        description: Attempts per workflow (1 for preflight, exactly 100 for qualification)
        required: true
        default: '1'
        type: choice
        options: ['1', '100']

permissions:
  actions: read
  contents: read

jobs:
  repeat:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target_os: linux
            target_arch: amd64
            executable: playtestr
            archive_extension: tar.gz
          - runner: macos-15
            target_os: darwin
            target_arch: arm64
            executable: playtestr
            archive_extension: tar.gz
          - runner: windows-latest
            target_os: windows
            target_arch: amd64
            executable: playtestr.exe
            archive_extension: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache-dependency-path: |
            go.sum
            corpus/controls/*/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24.7.0'
      - name: Pin Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Download frozen native archive
        uses: actions/download-artifact@v6
        with:
          name: playtestr-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify and extract frozen runner
        shell: bash
        run: |
          set -euo pipefail
          evidence="$(find candidate -name 'candidate-evidence-*.json' -type f)"
          test -n "$evidence"
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_commit"])' "$evidence")" = "$GITHUB_SHA"
          archive="$(find candidate -name 'playtestr_*.${{ matrix.archive_extension }}' -type f)"
          expected_archive="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_sha256"])' "$evidence")"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$expected_archive"
          mkdir -p 'frozen candidate'
          if [[ '${{ matrix.target_os }}' == windows ]]; then
            unzip -q "$archive" -d 'frozen candidate'
          else
            tar -xzf "$archive" -C 'frozen candidate'
          fi
          runner="$(find 'frozen candidate' -name '${{ matrix.executable }}' -type f)"
          test -n "$runner"
          expected_executable="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["executable_sha256"])' "$evidence")"
          test "$(sha256sum "$runner" | awk '{print $1}')" = "$expected_executable"
          echo "FROZEN_RUNNER=$runner" >> "$GITHUB_ENV"
          echo "FROZEN_RUNNER_SHA256=$expected_executable" >> "$GITHUB_ENV"
      - name: Prepare exact target pins
        shell: bash
        run: bash scripts/qualification/setup-targets.sh
      - name: Run first-attempt campaign
        shell: bash
        run: |
          set -euo pipefail
          suffix=''
          if [[ '${{ matrix.target_os }}' == windows ]]; then suffix='.exe'; fi
          go run ./cmd/qualification-campaign \
            -runner "$FROZEN_RUNNER" \
            -attempts '${{ inputs.attempts }}' \
            -out 'artifacts/qualification-${{ matrix.target_os }}-${{ matrix.target_arch }}' \
            -target ".tools/external/gum$suffix" \
            -target ".trial-private/corpus-tools/lazygit-target/lazygit$suffix" \
            -target ".trial-private/corpus-tools/bottom-original/btm$suffix" \
            -target '.trial-private/corpus-tools/micro.exe' \
            -target '.trial-private/corpus-tools/create-vite-runtime/package-lock.json'
          python - '${{ inputs.attempts }}' 'artifacts/qualification-${{ matrix.target_os }}-${{ matrix.target_arch }}/summary.json' <<'PY'
          import json, sys
          attempts = int(sys.argv[1])
          record = json.load(open(sys.argv[2], encoding='utf-8'))
          assert record['attempt_count'] == attempts * 10, record
          assert record['runner_sha256'] == __import__('os').environ['FROZEN_RUNNER_SHA256'], record
          assert record['first_attempt_failures'] == 0 and record['managed_cleanup_failures'] == 0, record
          PY
          cp .trial-private/corpus-tools/qualification-targets.txt 'artifacts/qualification-${{ matrix.target_os }}-${{ matrix.target_arch }}/'
          cp candidate/candidate-evidence-*.json 'artifacts/qualification-${{ matrix.target_os }}-${{ matrix.target_arch }}/'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qualification-${{ matrix.target_os }}-${{ matrix.target_arch }}-${{ inputs.attempts }}
          path: artifacts/qualification-${{ matrix.target_os }}-${{ matrix.target_arch }}
          if-no-files-found: warn
          retention-days: 14
