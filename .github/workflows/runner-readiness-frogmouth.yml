name: Runner readiness Frogmouth native
on:
  push:
    branches: [work/p0-p2-implementation]
    paths: ['.github/workflows/runner-readiness-frogmouth.yml']
  workflow_dispatch:
    inputs:
      hosts:
        type: choice
        default: both
        options: [both, linux, windows]
        description: Native hosts for source-reviewed first use
      phase:
        type: choice
        default: first-use
        options: [first-use, author, qualify]
        description: First useful route or twenty declared public recordings
      original_faults:
        type: boolean
        default: false
        description: Consume fresh original Linux F04 once after committed twenty-case freeze
permissions:
  contents: read
env:
  SOURCE_REVISION: f46f2409985af077fd29723ab963d24792eabbbe
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  GOTOOLCHAIN: local
concurrency:
  group: playtestr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terminal:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: ${{ fromJSON(inputs.hosts == 'linux' && '["ubuntu-24.04"]' || inputs.hosts == 'windows' && '["windows-2025"]' || '["ubuntu-24.04", "windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Wyrcan-io/playtestr
          ref: f46f2409985af077fd29723ab963d24792eabbbe
          path: .playtestr-tooling
          persist-credentials: false
          set-safe-directory: false
      - name: Owned official SDK and caches
        run: |
          campaign="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass"
          mkdir -p "$campaign/tmp" "$campaign/go-cache" "$campaign/gopath"
          export TEMP="$campaign/tmp" TMP="$campaign/tmp" TMPDIR="$campaign/tmp" GOTMPDIR="$campaign/tmp"
          export GOCACHE="$campaign/go-cache" GOPATH="$campaign/gopath" GOMODCACHE="$campaign/gopath/pkg/mod"
          for name in TEMP TMP TMPDIR GOTMPDIR GOCACHE GOPATH GOMODCACHE; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          python scripts/acceptance/readiness_check.py --label frogmouth-native-sdk --timeout 360 -- python scripts/acceptance/readiness_bootstrap_go.py
          echo "$campaign/toolchain/go/bin" >> "$GITHUB_PATH"
      - name: Build exact source candidate with prelaunch evidence
        run: |
          mkdir -p .playtestr-bin
          ext=''
          if [ "$RUNNER_OS" = Windows ]; then ext='.exe'; fi
          python scripts/acceptance/readiness_check.py --label frogmouth-candidate-build --timeout 180 -- go -C .playtestr-tooling build -trimpath -ldflags "-X github.com/Wyrcan-io/playtestr/internal/buildinfo.Version=source-$SOURCE_REVISION" -o "$GITHUB_WORKSPACE/.playtestr-bin/playtestr$ext" ./cmd/playtestr
          test "$(.playtestr-bin/playtestr$ext --version)" = "playtestr source-$SOURCE_REVISION"
      - name: Reviewed installed native Python setup
        id: prepare
        run: python scripts/acceptance/readiness_frogmouth_native_prepare.py
      - name: First public recording, explicit review and ordinary replay
        run: |
          python scripts/acceptance/readiness_check.py --label native-frogmouth-first-public-route --timeout 600 -- python scripts/acceptance/readiness_frogmouth_first_use.py
      - name: Author twenty declared public workflows and independently check original bytes
        if: inputs.phase == 'author'
        run: python scripts/acceptance/readiness_check.py --label native-frogmouth-twenty-public-recordings --timeout 1200 -- python scripts/acceptance/readiness_frogmouth_cases.py
      - name: Verify full public directory suite and freeze reviewed exports
        if: inputs.phase == 'author'
        run: python scripts/acceptance/readiness_check.py --label native-frogmouth-twenty-ordinary-freeze --timeout 900 -- python scripts/acceptance/readiness_frogmouth_freeze.py
      - name: Execute exact independently reviewed native profile
        if: inputs.phase == 'qualify'
        run: python scripts/acceptance/readiness_check.py --label native-frogmouth-frozen-twenty --timeout 900 -- python scripts/acceptance/readiness_frogmouth_native_contracts.py
      - name: Actual editable source faults and exact restorations
        if: inputs.phase == 'qualify'
        run: |
          original=()
          if [ "$RUNNER_OS" = Linux ] && [ '${{ inputs.original_faults }}' = true ]; then original=(--original-heldout); fi
          python scripts/acceptance/readiness_check.py --label native-frogmouth-real-source-faults --timeout 900 -- python scripts/acceptance/readiness_frogmouth_faults.py "${original[@]}"
      - name: Public maintenance, suffix rerecord and relocated replay
        if: inputs.phase == 'qualify'
        run: python scripts/acceptance/readiness_check.py --label native-frogmouth-public-maintenance --timeout 900 -- python scripts/acceptance/readiness_frogmouth_maintenance.py
      - name: Verify pinned source restores and owned runtime termination
        if: always() && steps.prepare.outcome == 'success'
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python scripts/acceptance/readiness_check.py --label native-frogmouth-runtime-process-proof --timeout 45 -- powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/acceptance/readiness_windows_process_proof.ps1 -Project frogmouth
            python scripts/acceptance/readiness_check.py --label native-frogmouth-source-retention --timeout 180 -- python scripts/acceptance/readiness_cleanup_plop.py --project frogmouth --prepare-only
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/acceptance/readiness_remove_plop.ps1 -Project frogmouth
          else
            python scripts/acceptance/readiness_check.py --label native-frogmouth-source-cleanup --timeout 180 -- python scripts/acceptance/readiness_cleanup_plop.py --project frogmouth
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: playtestr-${{ runner.os }}
          path: |
            artifacts/runner-readiness-ten-project-pass/events/
            artifacts/runner-readiness-ten-project-pass/identities/
            artifacts/runner-readiness-ten-project-pass/core/
            artifacts/runner-readiness-ten-project-pass/frogmouth/
            artifacts/runner-readiness-ten-project-pass/frogmouth-native-runner.json
            artifacts/runner-readiness-ten-project-pass/frogmouth-runtime-baseline.json
            artifacts/runner-readiness-ten-project-pass/toolchain/sdk.json
            !artifacts/runner-readiness-ten-project-pass/frogmouth/retained-source/source.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
