name: Native release build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version such as v0.1.0 or v0.1.0-rc.2
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target_os: linux
            target_arch: amd64
            executable: playtestr
            demo: demo
            fixture: fixture
          - runner: macos-latest
            target_os: darwin
            target_arch: arm64
            executable: playtestr
            demo: demo
            fixture: fixture
          - runner: windows-latest
            target_os: windows
            target_arch: amd64
            executable: playtestr.exe
            demo: demo.exe
            fixture: fixture.exe
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache-dependency-path: go.sum
      - name: Validate release target
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          test "$(go env GOOS)" = "${{ matrix.target_os }}"
          test "$(go env GOARCH)" = "${{ matrix.target_arch }}"
      - name: Test
        run: go test -count=1 ./...
      - name: Build native binaries
        shell: bash
        run: |
          mkdir -p bin
          go build -o "bin/${{ matrix.demo }}" ./cmd/demo
          go build -o "bin/${{ matrix.fixture }}" ./cmd/fixture
          go build -trimpath -ldflags "-s -w -X github.com/Wyrcan-io/playtestr/internal/buildinfo.Version=$VERSION" -o "bin/${{ matrix.executable }}" ./cmd/playtestr
      - name: Package native release
        shell: bash
        run: go run ./cmd/package-release -binary "bin/${{ matrix.executable }}" -version "$VERSION" -os "${{ matrix.target_os }}" -arch "${{ matrix.target_arch }}" -out dist
      - name: Verify and run the extracted release archive
        shell: bash
        run: |
          base="playtestr_${VERSION#v}_${{ matrix.target_os }}_${{ matrix.target_arch }}"
          extension="tar.gz"
          if [ "${{ matrix.target_os }}" = "windows" ]; then
            extension="zip"
          fi
          archive="$base.$extension"

          if [ "${{ matrix.target_os }}" = "darwin" ]; then
            (cd dist && shasum -a 256 -c "$archive.sha256")
          else
            (cd dist && sha256sum --check "$archive.sha256")
          fi

          extract_dir="release verification"
          rm -rf -- "$extract_dir"
          mkdir -p "$extract_dir"
          actual_members="$extract_dir/archive-members.txt"
          expected_members="$extract_dir/expected-members.txt"
          if [ "${{ matrix.target_os }}" = "windows" ]; then
            unzip -Z1 "dist/$archive" | sort > "$actual_members"
          else
            tar -tzf "dist/$archive" | sort > "$actual_members"
          fi
          printf '%s\n' \
            "$base/LICENSE" \
            "$base/README.md" \
            "$base/THIRD_PARTY_NOTICES.md" \
            "$base/${{ matrix.executable }}" | sort > "$expected_members"
          diff --unified "$expected_members" "$actual_members"

          if [ "${{ matrix.target_os }}" = "windows" ]; then
            unzip -q "dist/$archive" -d "$extract_dir"
          else
            tar -xzf "dist/$archive" -C "$extract_dir"
            test -x "$extract_dir/$base/${{ matrix.executable }}"
          fi

          released_binary="$extract_dir/$base/${{ matrix.executable }}"
          test "$("$released_binary" --version)" = "playtestr $VERSION"
          "$released_binary" --help | grep --fixed-strings "Playtestr drives trusted interactive CLIs"
          "$released_binary" test --report artifacts/release-walkthrough.json examples/menu.json examples/menu-exit.json

          "$released_binary" test --list examples/suite > artifacts/release-suite-list.txt
          python -c 'from pathlib import Path; lines=[line.strip().replace("\\", "/") for line in Path("artifacts/release-suite-list.txt").read_text(encoding="utf-8").splitlines() if line.strip()]; assert lines == ["Selected 2 specs:", "examples/suite/menu-exit.json", "examples/suite/menu.json"], lines'
          "$released_binary" test --artifacts-dir artifacts/release-suite --report artifacts/release-suite-results.json examples/suite
          python -c 'import json; r=json.load(open("artifacts/release-suite-results.json", encoding="utf-8")); assert r["summary"] == {"total": 2, "passed": 2, "failed": 0, "cancelled": 0, "not_run": 0}; assert [x["spec_path"].replace("\\", "/") for x in r["results"]] == ["examples/suite/menu-exit.json", "examples/suite/menu.json"]'

          if [ "${{ matrix.target_os }}" != "windows" ]; then
            chmod +x testdata/install-smoke/unix/controlling-tty.sh
            "$released_binary" test --report artifacts/release-controlling-tty.json testdata/install-smoke/unix/controlling-tty.json
          fi

          set +e
          "$released_binary" test --report artifacts/release-expected-failure.json examples/snapshot-mismatch.json
          code=$?
          set -e
          test "$code" -eq 1
          grep --fixed-strings '"category": "snapshot_mismatch"' artifacts/release-expected-failure.json
          python -c 'import json; r=json.load(open("artifacts/release-expected-failure.json", encoding="utf-8"))["results"][0]; assert r["evidence"]["screen_path"].replace("\\", "/") == "examples/snapshot-mismatch.json.actual.txt"; assert r["evidence"]["diff_path"].replace("\\", "/") == "examples/snapshot-mismatch.json.diff.txt"'
          test -s examples/snapshot-mismatch.json.actual.txt
          test -s examples/snapshot-mismatch.json.diff.txt

          set +e
          "$released_binary" test --artifacts-dir artifacts/release-suite-failure --report artifacts/release-suite-failure.json examples/snapshot-mismatch.json
          code=$?
          set -e
          test "$code" -eq 1
          python -c 'import json, pathlib; p=pathlib.Path("artifacts/release-suite-failure.json"); r=json.load(p.open(encoding="utf-8"))["results"][0]; assert r["failure"]["category"] == "snapshot_mismatch"; refs=[r["evidence"]["screen_path"], r["evidence"]["diff_path"]]; assert all(pathlib.Path(ref).resolve().is_file() for ref in refs), refs; assert all("release-suite-failure" in ref.replace("\\", "/") for ref in refs), refs'
          "$released_binary" report --input artifacts/release-suite-failure.json --evidence-root artifacts --output artifacts/release-suite-failure.html
          grep --fixed-strings 'Playtestr offline report' artifacts/release-suite-failure.html
          grep --fixed-strings 'snapshot_mismatch' artifacts/release-suite-failure.html
          grep --fixed-strings 'Preview deployed successfully.' artifacts/release-suite-failure.html

          python scripts/release-cancel-smoke.py "$released_binary" "$(pwd)/bin/${{ matrix.fixture }}" "$(pwd)/artifacts/cancellation"
          grep --fixed-strings '"category": "cancelled"' artifacts/cancellation/release-cancellation.json
          grep --fixed-strings '"confirmed_exited": true' artifacts/cancellation/release-cancellation.json
      - name: Record immutable candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          base="playtestr_${VERSION#v}_${{ matrix.target_os }}_${{ matrix.target_arch }}"
          extension="tar.gz"
          if [ "${{ matrix.target_os }}" = "windows" ]; then extension="zip"; fi
          archive="dist/$base.$extension"
          binary="bin/${{ matrix.executable }}"
          extracted="release verification/$base/${{ matrix.executable }}"
          binary_sha=$(sha256sum "$binary" | awk '{print $1}')
          extracted_sha=$(sha256sum "$extracted" | awk '{print $1}')
          archive_sha=$(sha256sum "$archive" | awk '{print $1}')
          test "$binary_sha" = "$extracted_sha"
          members=$(python - "$archive" <<'PY'
          import json, sys, tarfile, zipfile
          path = sys.argv[1]
          if path.endswith('.zip'):
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
          else:
              with tarfile.open(path, 'r:gz') as archive:
                  names = archive.getnames()
          print(json.dumps(sorted(names)))
          PY
          )
          python - \
            "$GITHUB_SHA" "$VERSION" "${{ runner.os }}" "${{ runner.arch }}" \
            "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$(go version)" \
            "$binary_sha" "$archive_sha" "$members" "$archive" <<'PY'
          import json, sys
          (source, version, runner_os, runner_arch, image_os, image_version,
           toolchain, binary_sha, archive_sha, members, archive) = sys.argv[1:]
          record = {
              "schema_version": 1,
              "status": "candidate frozen; qualification pending",
              "source_commit": source,
              "version": version,
              "host": {
                  "runner_os": runner_os,
                  "runner_arch": runner_arch,
                  "image_os": image_os,
                  "image_version": image_version,
              },
              "toolchain": toolchain,
              "build_command": "go build -trimpath -ldflags '-s -w -X github.com/Wyrcan-io/playtestr/internal/buildinfo.Version=$VERSION' -o bin/<native-name> ./cmd/playtestr",
              "executable_sha256": binary_sha,
              "version_output": f"playtestr {version}",
              "archive": archive,
              "archive_sha256": archive_sha,
              "archive_members": json.loads(members),
              "extraction_path": "release verification",
              "extracted_executable_sha256": binary_sha,
              "smoke_exit_status": 0,
              "limitations": [
                  "hosted native build evidence; application compatibility requires R6-Q",
                  "candidate is not published or qualified",
              ],
          }
          path = f"artifacts/candidate-evidence-{runner_os.lower()}-{runner_arch.lower()}.json"
          with open(path, "w", encoding="utf-8") as output:
              json.dump(record, output, indent=2)
              output.write("\n")
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: playtestr-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: |
            dist/*
            artifacts/candidate-evidence-*.json
          if-no-files-found: error
