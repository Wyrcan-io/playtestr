name: Next twenty Skim exact rc.6 final series
on:
  push:
    branches: [work/p0-p2-implementation]
    paths:
      - '.github/workflows/runner-readiness-next20-skim-final.yml'
      - 'scripts/acceptance/next20_skim_final*.py'
      - 'scripts/acceptance/next20_skim_final_faults.py'
      - 'scripts/acceptance/next20_skim_final_plan_audit.py'
      - 'scripts/acceptance/next20_skim_public_route.py'
      - 'scripts/acceptance/test_next20_skim_public_route.py'
      - 'scripts/acceptance/next20_playtestr_case.py'
      - 'scripts/acceptance/next20_candidate*.py'
      - 'scripts/acceptance/next20_acquire.py'
      - 'scripts/acceptance/next20_rust_fetch.py'
      - 'scripts/acceptance/next20_skim_build.py'
      - 'scripts/acceptance/next20_skim_hook_review.py'
      - 'scripts/acceptance/next20_skim_source_verify.py'
      - 'scripts/acceptance/next20_target_cleanup.py'
      - 'scripts/acceptance/test_next20_target_cleanup.py'
      - 'scripts/acceptance/next20_skim_cache_cleanup.py'
      - 'scripts/acceptance/next20_skim_target_remove.py'
      - 'scripts/acceptance/next20_remove_target.ps1'
      - 'scripts/acceptance/next20_target_process_proof.ps1'
      - 'scripts/acceptance/next20_check.py'
      - 'scripts/acceptance/next20_jrnl_final.py'
      - 'scripts/acceptance/adversarial_process.py'
      - 'scripts/acceptance/readiness_evidence.py'
      - 'docs/validation/runner-readiness-next-twenty-project-pass/skim/**'
      - 'docs/validation/runner-readiness-next-twenty-project-pass/replacement-candidate-freeze-native-exit-v1.json'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: playtestr-next20-skim-final
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  GOENV: off
  GOTOOLCHAIN: local
  GOWORK: off
  TEMP: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp
  TMP: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp
  TMPDIR: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp
jobs:
  native-final:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - host: linux
            runs_on: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            candidate_run: '40424475362'
            candidate_artifact: next20-private-replacement-Linux
            candidate_archive: playtestr_0.4.0-rc.6_linux_amd64.tar.gz
          - host: windows
            runs_on: windows-2025
            rust_target: x86_64-pc-windows-msvc
            candidate_run: '40425810038'
            candidate_artifact: next20-private-replacement-Windows
            candidate_archive: playtestr_0.4.0-rc.6_windows_amd64.zip
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Create isolated campaign roots
        run: |
          $base = Join-Path $env:GITHUB_WORKSPACE 'artifacts/runner-readiness-next-twenty-project-pass'
          @((Join-Path $base 'tmp'), (Join-Path $base 'candidate-download')) | ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.0'
          check-latest: false
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Acquire pinned source and verify exact file set
        id: acquire
        run: |
          python -B scripts/acceptance/next20_acquire.py skim --omitted-documentation-links docs/validation/runner-readiness-next-twenty-project-pass/skim/omitted-documentation-links-v3.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/acceptance/next20_skim_source_verify.py --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare Go and task-owned roots
        env:
          GOMODCACHE: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/active/skim/go-mod-cache
          GOCACHE: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/active/skim/home/go-cache
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'artifacts/runner-readiness-next-twenty-project-pass/active/skim'
          @($env:GOMODCACHE, $env:GOCACHE, (Join-Path $root 'home'), (Join-Path $root 'bin'), (Join-Path $root 'tmp'), (Join-Path $root 'cargo-home'), (Join-Path $root 'rustup-home'), (Join-Path $root 'cargo-target')) | ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned native Rust toolchain
        env:
          HOME: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/active/skim/home
          USERPROFILE: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/active/skim/home
          RUSTUP_HOME: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/active/skim/home/.rustup
          CARGO_HOME: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/active/skim/cargo-home
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target '${{ matrix.rust_target }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch locked dependencies, review hooks, build target offline
        id: prepare
        env:
          HOME: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/active/skim/home
          USERPROFILE: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/active/skim/home
        run: |
          python -B scripts/acceptance/next20_check.py --label skim-final-dependency-fetch --timeout 700 -- python -B scripts/acceptance/next20_rust_fetch.py skim --native-host --toolchain 1.97.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/acceptance/next20_check.py --label skim-final-hook-review --timeout 120 -- python -B scripts/acceptance/next20_skim_hook_review.py --source-review docs/validation/runner-readiness-next-twenty-project-pass/skim/source-review-v1.json --output artifacts/runner-readiness-next-twenty-project-pass/active/skim/dependency-hook-review-host.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.host }}' -eq 'windows') { python -B scripts/acceptance/next20_check.py --label skim-final-native-build --timeout 1800 -- python -B scripts/acceptance/next20_skim_build.py --native-host --source-review docs/validation/runner-readiness-next-twenty-project-pass/skim/source-review-v1.json --hook-review artifacts/runner-readiness-next-twenty-project-pass/active/skim/dependency-hook-review-host.json } else { python -B scripts/acceptance/next20_check.py --label skim-final-native-build --timeout 1800 -- python -B scripts/acceptance/next20_skim_build.py --source-review docs/validation/runner-readiness-next-twenty-project-pass/skim/source-review-v1.json --hook-review artifacts/runner-readiness-next-twenty-project-pass/active/skim/dependency-hook-review-host.json }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: Wyrcan-io/playtestr
          run-id: ${{ matrix.candidate_run }}
          name: ${{ matrix.candidate_artifact }}
          path: artifacts/runner-readiness-next-twenty-project-pass/candidate-download
      - name: Install exact frozen rc.6 runner archive
        run: |
          $freeze = Get-Content -Raw 'docs/validation/runner-readiness-next-twenty-project-pass/replacement-candidate-freeze-native-exit-v1.json' | ConvertFrom-Json
          $cells = @($freeze.cells | Where-Object { $_.host -eq '${{ matrix.host }}' })
          if ($cells.Count -ne 1 -or [IO.Path]::GetFileName($cells[0].archive_local_only) -ne '${{ matrix.candidate_archive }}') { throw 'Frozen candidate host/archive missing or duplicated' }
          $downloads = @(Get-ChildItem -LiteralPath 'artifacts/runner-readiness-next-twenty-project-pass/candidate-download' -File -Recurse | Where-Object { $_.Name -ceq '${{ matrix.candidate_archive }}' })
          if ($downloads.Count -ne 1) { throw 'Expected exactly one frozen candidate archive' }
          $destination = Join-Path $env:GITHUB_WORKSPACE $cells[0].archive_local_only
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
          Copy-Item -LiteralPath $downloads[0].FullName -Destination $destination
          python -B scripts/acceptance/next20_candidate_install.py --series native-exit-v1 --archive $cells[0].archive_local_only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate final-series planner
        run: python -B -m unittest test_next20_skim_final_series test_next20_skim_public_route test_next20_target_cleanup test_next20_acquire test_next20_storage test_next20_skim_cleanup test_readiness_evidence -v
        working-directory: scripts/acceptance
      - name: Freeze all derived contracts before target execution
        run: python -B scripts/acceptance/next20_check.py --label skim-final-contract-freeze --timeout 180 -- python -B scripts/acceptance/next20_skim_final_series.py --host '${{ matrix.host }}' --prepare-only
      - name: Independently reconstruct all frozen contracts
        run: python -B scripts/acceptance/next20_check.py --label skim-final-independent-plan-audit --timeout 300 -- python -B scripts/acceptance/next20_skim_final_plan_audit.py --plan artifacts/runner-readiness-next-twenty-project-pass/skim/final-series-plan-native-exit-v28/${{ matrix.host }}/plan.json
      - name: Execute twelve exact-archive batches
        id: final
        env:
          READINESS_EVIDENCE_PHASE: final-archive
        run: python -B scripts/acceptance/next20_check.py --label skim-final-exact-rc6-series --timeout 2400 -- python -B scripts/acceptance/next20_skim_final_series.py --host '${{ matrix.host }}'
      - name: Execute final candidate source-fault calibrations
        if: steps.final.outcome == 'success'
        env:
          READINESS_EVIDENCE_PHASE: final-archive
        run: python -B scripts/acceptance/next20_check.py --label skim-final-rc6-fault-calibration --timeout 2400 -- python -B scripts/acceptance/next20_skim_final_faults.py --host '${{ matrix.host }}' --candidate-series native-exit-v1
      - name: Exercise public Skim first-use, diagnosis, maintenance and relocation
        if: steps.final.outcome == 'success'
        env:
          READINESS_EVIDENCE_PHASE: public-authoring
        run: python -B scripts/acceptance/next20_check.py --label skim-final-public-authoring --timeout 900 -- python -B scripts/acceptance/next20_skim_public_route.py
      - name: Verify source and process-tree cleanup
        id: verify-cleanup
        if: always() && steps.acquire.outcome == 'success'
        run: |
          python -B scripts/acceptance/next20_skim_source_verify.py --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.host }}' -eq 'windows') { python -B scripts/acceptance/next20_check.py --label skim-final-process-proof --timeout 120 -- powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/acceptance/next20_target_process_proof.ps1 -Project skim }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove only verified Skim compiler caches
        id: cache-cleanup
        if: always() && steps.verify-cleanup.outcome == 'success'
        run: python -B scripts/acceptance/next20_check.py --label skim-final-cache-cleanup --timeout 300 -- python -B scripts/acceptance/next20_skim_cache_cleanup.py
      - name: Prepare checked target cleanup
        id: cleanup-preflight
        if: always() && steps.cache-cleanup.outcome == 'success'
        run: |
          $target = Join-Path $env:GITHUB_WORKSPACE 'artifacts/runner-readiness-next-twenty-project-pass/active/skim'
          if (Test-Path -LiteralPath $target) {
            python -B scripts/acceptance/next20_check.py --label skim-final-cleanup-preflight --timeout 300 -- python -B scripts/acceptance/next20_target_cleanup.py --project skim --prepare-only --include-active-case-evidence --no-case-reports --retain-owned-directory case-evidence --max-files 60000 --max-bytes 2147483648
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Output 'No Skim target tree was created; cleanup not applicable.' }
      - name: Remove checked Windows target tree
        if: always() && steps.cleanup-preflight.outcome == 'success' && matrix.host == 'windows'
        run: python -B scripts/acceptance/next20_check.py --label skim-final-target-removal --timeout 300 -- powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/acceptance/next20_remove_target.ps1 -Project skim -MaxFiles 60000 -MaxBytes 2147483648
      - name: Remove checked Unix target tree
        if: always() && steps.cleanup-preflight.outcome == 'success' && matrix.host == 'linux'
        run: python -B scripts/acceptance/next20_check.py --label skim-final-target-removal --timeout 300 -- python -B scripts/acceptance/next20_skim_target_remove.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: next20-skim-${{ matrix.host }}-rc6-final
          path: |
            docs/validation/runner-readiness-next-twenty-project-pass/skim/
            artifacts/runner-readiness-next-twenty-project-pass/skim/**
            artifacts/runner-readiness-next-twenty-project-pass/candidate-native-exit-v1/${{ matrix.host }}/**
            artifacts/runner-readiness-next-twenty-project-pass/replacement-archives/native-exit-v1/${{ matrix.candidate_archive }}
            artifacts/runner-readiness-next-twenty-project-pass/events/**
            artifacts/runner-readiness-next-twenty-project-pass/active/skim/*.json
            artifacts/runner-readiness-next-twenty-project-pass/active/skim/case-evidence/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
