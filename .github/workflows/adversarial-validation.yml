name: Adversarial native validation

on:
  push:
    branches: [work/p0-p2-implementation]
    paths:
      - '.github/workflows/adversarial-validation.yml'
      - 'scripts/acceptance/adversarial_*.py'
      - 'scripts/acceptance/test_adversarial_harness.py'
      - 'docs/validation/ten-new-project-adversarial-pass/**'
      - 'internal/runner/adversarial_*_test.go'
  workflow_dispatch:
    inputs:
      final_campaign:
        description: Run the guarded all-ten campaign on one frozen runner per host
        type: boolean
        default: false
      ranger_startup_probe:
        description: Run only the bounded Ranger first-key diagnostic
        type: boolean
        default: false

permissions:
  contents: read

env:
  ACTIVE_PROJECT: nnn

jobs:
  controls:
    if: github.event_name != 'workflow_dispatch' || (!inputs.ranger_startup_probe && !inputs.final_campaign)
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Native bounded process and state oracle calibration
        run: python -m unittest discover -s scripts/acceptance -p test_adversarial_harness.py -v
      - name: Real Windows startup regression before and after repair
        if: runner.os == 'Windows'
        run: python scripts/acceptance/adversarial_startup_regression.py
      - name: Real Windows short-path regression before and after repair
        if: runner.os == 'Windows'
        run: python scripts/acceptance/adversarial_workspace_path_regression.py
      - name: Actual native product events
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ten-new-project-adversarial-pass/core
          export PLAYTESTR_ADVERSARIAL_EVIDENCE_DIR="$GITHUB_WORKSPACE/artifacts/ten-new-project-adversarial-pass/core/stress"
          go test -json -count=1 ./... > artifacts/ten-new-project-adversarial-pass/core/test-events.jsonl
          go vet ./...
          if [ "$RUNNER_OS" = Windows ]; then
            export PATH="/c/msys64/mingw64/bin:/c/msys64/ucrt64/bin:$PATH"
            export CC=gcc
          fi
          export CGO_ENABLED=1
          if [ "$RUNNER_OS" = macOS ]; then
            go test -race -json -count=50 -run '^TestAdversarialStubbornUnixDescendantCleanup$' ./internal/runner > artifacts/ten-new-project-adversarial-pass/core/stubborn-race-events.jsonl
          fi
          go test -race -json -count=1 ./... > artifacts/ten-new-project-adversarial-pass/core/race-events.jsonl
      - name: Historical wizard sequence with retained failure screens
        shell: bash
        run: |
          set -euo pipefail
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          go build -trimpath -ldflags "-X github.com/Wyrcan-io/playtestr/internal/buildinfo.Version=source-${GITHUB_SHA}" -o "bin/playtestr${suffix}" ./cmd/playtestr
          go build -o "bin/fixture${suffix}" ./cmd/fixture
          python scripts/acceptance/adversarial_wizard_reproduction.py --count 100
      - name: Instrumented Windows wizard confirmation and saved-file diagnosis
        if: always() && runner.os == 'Windows' && hashFiles('bin/playtestr.exe') != '' && hashFiles('bin/fixture.exe') != ''
        run: python scripts/acceptance/adversarial_wizard_reproduction.py --count 100 --trace
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: adversarial-controls-${{ matrix.os }}
          path: |
            artifacts/ten-new-project-adversarial-pass/**
            docs/validation/ten-new-project-adversarial-pass/attempts.jsonl
            docs/validation/ten-new-project-adversarial-pass/attempts-v2.jsonl
            docs/validation/ten-new-project-adversarial-pass/identities
          if-no-files-found: error
          retention-days: 14
  project:
    # Full external-application campaigns are explicitly dispatched after their
    # reviewed corpus is ready. Core CI still runs on every relevant push.
    if: github.event_name == 'workflow_dispatch' && !inputs.ranger_startup_probe && !inputs.final_campaign
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        timeout-minutes: 5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: false
      - name: Pinned application native flows, mutations, restoration and fresh repetitions
        shell: bash
        run: python scripts/acceptance/adversarial_native_project.py --project "$ACTIVE_PROJECT"
      - name: Remove owned application after qualification and process verification
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -File scripts/acceptance/remove-adversarial-project.ps1 -Project "$ACTIVE_PROJECT"
          else
            python scripts/acceptance/adversarial_cleanup_unix.py --project "$ACTIVE_PROJECT"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: adversarial-${{ env.ACTIVE_PROJECT }}-${{ matrix.os }}
          path: |
            artifacts/ten-new-project-adversarial-pass/**
            docs/validation/ten-new-project-adversarial-pass/attempts.jsonl
            docs/validation/ten-new-project-adversarial-pass/attempts-v2.jsonl
            docs/validation/ten-new-project-adversarial-pass/identities
          if-no-files-found: error
          retention-days: 14
  ranger-startup-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.ranger_startup_probe && !inputs.final_campaign
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Build unchanged runner and acquire pinned owned Ranger
        run: |
          go build -trimpath -o bin/playtestr ./cmd/playtestr
          python scripts/acceptance/adversarial_setup_python.py --project ranger
      - name: Observe actual numeric getch events with weak and stronger startup checkpoints
        run: python scripts/acceptance/adversarial_ranger_startup_probe.py
      - name: Verify restored source and remove owned diagnostic target
        if: always()
        run: python scripts/acceptance/adversarial_cleanup_unix.py --project ranger --exploratory
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: adversarial-ranger-startup-probe-macos-15
          path: |
            artifacts/ten-new-project-adversarial-pass/**
            docs/validation/ten-new-project-adversarial-pass/attempts-v2.jsonl
            docs/validation/ten-new-project-adversarial-pass/identities
          if-no-files-found: error
          retention-days: 14
  final-campaign:
    if: github.event_name == 'workflow_dispatch' && inputs.final_campaign
    uses: ./.github/workflows/adversarial-final.yml
