name: Published install smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to verify
        required: true
        default: v0.3.0-rc.1
      verify_controlling_tty:
        description: Require the Unix /dev/tty regression (disable only for the known-bad rc.1 baseline)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  install:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target_os: linux
            target_arch: amd64
            fixture: unix
          - runner: macos-latest
            target_os: darwin
            target_arch: arm64
            fixture: unix
          - runner: windows-latest
            target_os: windows
            target_arch: amd64
            fixture: windows
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Put an obsolete Playtestr first on PATH
        shell: bash
        run: |
          set -euo pipefail
          stale_dir="$(pwd)/stale playtestr"
          mkdir -p "$stale_dir"
          printf '#!/bin/sh\nprintf "playtestr stale\\n"\n' > "$stale_dir/playtestr"
          chmod +x "$stale_dir/playtestr"
          printf '%s\n' "$stale_dir" >> "$GITHUB_PATH"
      - name: Install the exact published release
        id: setup
        uses: ./setup-playtestr
        with:
          version: ${{ inputs.version }}
      - name: Exercise pass, failure, evidence, and recovery
        shell: bash
        env:
          RELEASED_BINARY: ${{ steps.setup.outputs.binary-path }}
          ARCHIVE_SHA256: ${{ steps.setup.outputs.archive-sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          test "$(playtestr --version)" = "playtestr $VERSION"
          test ${#ARCHIVE_SHA256} -eq 64

          install_root="installation smoke"
          test_dir="$install_root/first test"
          evidence_dir="install-smoke-evidence"
          rm -rf -- "$install_root" "$evidence_dir"
          mkdir -p "$test_dir" "$evidence_dir"

          no_go_dir="$(pwd)/$install_root/no-go-bin"
          mkdir -p "$no_go_dir"
          cat > "$no_go_dir/go" <<'EOF'
          #!/bin/sh
          exit 97
          EOF
          chmod +x "$no_go_dir/go"
          runtime_path="$no_go_dir:$PATH"
          set +e
          env -u GOROOT -u GOPATH PATH="$runtime_path" go version >/dev/null 2>&1
          go_code=$?
          set -e
          test "$go_code" -eq 97

          test "$(env -u GOROOT -u GOPATH "$RELEASED_BINARY" --version)" = "playtestr $VERSION"
          env -u GOROOT -u GOPATH "$RELEASED_BINARY" --help | grep --fixed-strings "Playtestr drives trusted interactive CLIs"

          cp -R "testdata/install-smoke/${{ matrix.fixture }}/." "$test_dir/"
          cd "$test_dir"
          if [ "${{ matrix.target_os }}" != "windows" ]; then
            chmod +x hello.sh sentinel.sh
          fi

          cp good.json test.json
          env -u GOROOT -u GOPATH "$RELEASED_BINARY" test --report first-pass.json test.json
          grep --fixed-strings "\"runner_version\": \"$VERSION\"" first-pass.json
          grep --fixed-strings '"passed": 1' first-pass.json

          if [ "${{ matrix.target_os }}" != "windows" ] && [ "${{ inputs.verify_controlling_tty }}" = "true" ]; then
            env -u GOROOT -u GOPATH "$RELEASED_BINARY" test --report controlling-tty.json.result.json controlling-tty.json
            grep --fixed-strings '"passed": 1' controlling-tty.json.result.json
          fi

          cp bad.json test.json
          set +e
          env -u GOROOT -u GOPATH "$RELEASED_BINARY" test --report intentional-failure.json test.json > intentional-failure-output.txt 2>&1
          failure_code=$?
          set -e
          test "$failure_code" -eq 1
          grep --fixed-strings '"category": "assertion_timeout"' intentional-failure.json
          grep --fixed-strings '"screen_path": "test.json.actual.txt"' intentional-failure.json
          test -s test.json.actual.txt
          env -u GOROOT -u GOPATH "$RELEASED_BINARY" report --input intentional-failure.json --evidence-root . --output intentional-failure.html
          grep --fixed-strings 'Playtestr offline report' intentional-failure.html
          grep --fixed-strings 'assertion_timeout' intentional-failure.html
          grep --fixed-strings 'Hello, terminal tester!' intentional-failure.html

          cp good.json test.json
          env -u GOROOT -u GOPATH "$RELEASED_BINARY" test --report recovered.json test.json
          grep --fixed-strings '"passed": 1' recovered.json
          if grep --quiet '"screen_path"' recovered.json; then
            exit 1
          fi
          test -s test.json.actual.txt
          rm -- test.json.actual.txt
          test ! -e test.json.actual.txt

          set +e
          env -u GOROOT -u GOPATH "$RELEASED_BINARY" test --report missing-target.json.result.json missing-target.json > missing-target-output.txt 2>&1
          missing_code=$?
          set -e
          test "$missing_code" -eq 1
          grep --fixed-strings '"category": "launch_failure"' missing-target.json.result.json

          set +e
          env -u GOROOT -u GOPATH "$RELEASED_BINARY" test --report unsupported.json.result.json unsupported.json > unsupported-output.txt 2>&1
          unsupported_code=$?
          set -e
          test "$unsupported_code" -eq 1
          grep --fixed-strings '"category": "invalid_spec"' unsupported.json.result.json
          test ! -e sentinel.started

          mkdir blocked-report
          cp good.json test.json
          set +e
          env -u GOROOT -u GOPATH "$RELEASED_BINARY" test --report blocked-report test.json > blocked-report-output.txt 2>&1
          blocked_code=$?
          set -e
          test "$blocked_code" -eq 1
          grep --fixed-strings 'FAIL write report:' blocked-report-output.txt
          test -d blocked-report

          cp first-pass.json intentional-failure.json recovered.json \
            missing-target.json.result.json unsupported.json.result.json \
            intentional-failure-output.txt missing-target-output.txt \
            unsupported-output.txt blocked-report-output.txt intentional-failure.html \
            "../../$evidence_dir/"
          if [ -f controlling-tty.json.result.json ]; then
            cp controlling-tty.json.result.json "../../$evidence_dir/"
          fi
          printf '%s\n' \
            "version=$VERSION" \
            "host=${{ matrix.target_os }}/${{ matrix.target_arch }}" \
            "binary=$RELEASED_BINARY" \
            "sha256=$ARCHIVE_SHA256" \
            "stale_path_overridden=true" \
            "go_shell_lookup_shadowed=true" \
            "controlling_tty_required=${{ inputs.verify_controlling_tty }}" \
            "fresh_path=$test_dir" > "../../$evidence_dir/summary.txt"

          cd ../..
          rm -rf -- "$install_root"
          test ! -e "$install_root"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: install-smoke-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: |
            install-smoke-evidence/
            installation smoke/first test/*.json
            installation smoke/first test/*.actual.txt
            installation smoke/first test/*.html
            installation smoke/first test/*-output.txt
          if-no-files-found: warn
          retention-days: 14
