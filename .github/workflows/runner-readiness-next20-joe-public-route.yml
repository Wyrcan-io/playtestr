name: Runner readiness next20 JOE public authoring route

on:
  push:
    branches:
      - work/p0-p2-implementation
    paths:
      - .github/workflows/runner-readiness-next20-joe-public-route.yml
      - scripts/acceptance/next20_joe_public_route.py
      - scripts/acceptance/next20_joe_oracle_calibration.py
      - scripts/acceptance/test_next20_joe_oracle_calibration.py
      - scripts/acceptance/next20_joe_build.py
      - scripts/acceptance/next20_target_cleanup.py
      - scripts/acceptance/next20_remove_target.ps1
      - scripts/acceptance/test_next20_target_cleanup.py
      - docs/validation/runner-readiness-next-twenty-project-pass/joe/public-route-declaration-v5.json
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: playtestr-next20-joe-public-route-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  TEMP: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp
  TMP: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp
  TMPDIR: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp

jobs:
  public-route:
    name: JOE public route (${{ matrix.host }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - host: linux
            os: ubuntu-24.04
            candidate_run_id: 43056391377
            candidate_artifact: next20-private-replacement-Linux
            candidate_archive: artifacts/runner-readiness-next-twenty-project-pass/candidate-download/replacement-candidate/native-exit-v2/linux-amd64/dist/playtestr_0.4.0-rc.7_linux_amd64.tar.gz
          - host: darwin
            os: macos-15
            candidate_run_id: 43056391377
            candidate_artifact: next20-private-replacement-macOS
            candidate_archive: artifacts/runner-readiness-next-twenty-project-pass/candidate-download/replacement-candidate/native-exit-v2/darwin-arm64/dist/playtestr_0.4.0-rc.7_darwin_arm64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          set-safe-directory: false

      - name: Create campaign temporary root
        run: mkdir -p artifacts/runner-readiness-next-twenty-project-pass/tmp

      - name: Validate bounded cleanup rules and JOE install aliases
        run: python -B -m unittest test_next20_target_cleanup -v
        working-directory: scripts/acceptance

      - name: Validate independent JOE oracle calibration contract
        run: python -B -m unittest test_next20_joe_oracle_calibration -v
        working-directory: scripts/acceptance

      - name: Start shared acquisition and native build deadline
        id: timer
        run: echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Install reviewed Autotools prerequisites on macOS
        if: matrix.host == 'darwin'
        run: brew install autoconf automake

      - name: Acquire exact JOE source pin
        id: acquire
        run: python -B scripts/acceptance/next20_acquire.py joe

      - name: Build JOE at its retained runtime prefix
        if: steps.acquire.outcome == 'success'
        run: >-
          python -B scripts/acceptance/next20_joe_build.py
          --expected-host "${{ matrix.host }}"
          --operation-started-epoch "${{ steps.timer.outputs.started_epoch }}"

      - name: Download frozen native rc.7 runner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.candidate_run_id }}
          name: ${{ matrix.candidate_artifact }}
          path: artifacts/runner-readiness-next-twenty-project-pass/candidate-download

      - name: Install and verify only the exact frozen candidate archive
        run: >-
          python -B scripts/acceptance/next20_candidate_install.py
          --series native-exit-v2
          --archive "${{ matrix.candidate_archive }}"

      - name: Exercise documented JOE first-use and maintenance route
        if: steps.acquire.outcome == 'success'
        run: python -B scripts/acceptance/next20_joe_public_route.py --host "${{ matrix.host }}"
          --series native-exit-v2

      - name: Calibrate public file and saved-state oracles
        if: steps.acquire.outcome == 'success'
        run: python -B scripts/acceptance/next20_joe_oracle_calibration.py --host "${{ matrix.host }}"

      - name: Confirm source restoration and remove the owned JOE tree
        if: always() && steps.acquire.outcome == 'success'
        run: python -B scripts/acceptance/next20_target_cleanup.py --project joe --no-case-reports

      - name: Verify campaign storage bounds
        if: always() && steps.acquire.outcome == 'success'
        run: python -B scripts/acceptance/next20_storage.py joe

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: next20-joe-public-route-${{ matrix.host }}-${{ github.run_id }}
          path: |
            artifacts/runner-readiness-next-twenty-project-pass/joe/**
            artifacts/runner-readiness-next-twenty-project-pass/events/**
            artifacts/runner-readiness-next-twenty-project-pass/identities/**
            artifacts/runner-readiness-next-twenty-project-pass/active/joe/**
            artifacts/runner-readiness-next-twenty-project-pass/candidate-native-exit-v2/${{ matrix.host }}/installed.json
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
