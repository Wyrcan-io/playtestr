name: Runner readiness next20 Percol native feasibility

on:
  push:
    branches:
      - work/p0-p2-implementation
    paths:
      - .github/workflows/runner-readiness-next20-percol-feasibility.yml
      - docs/validation/runner-readiness-next-twenty-project-pass/percol/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-feasibility:
    name: Native Python 2 feasibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install source build tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y gnupg build-essential libncurses-dev libreadline-dev zlib1g-dev libsqlite3-dev libffi-dev
          else
            brew install gnupg
            xcode-select -p
          fi

      - name: Verify pinned sources and build isolated CPython 2.7.18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/percol-feasibility"
          cd "$RUNNER_TEMP/percol-feasibility"
          PERCOL_PIN=4b28037e328da3d0fe8165c11b800cbaddcb525e
          mkdir -p "$GITHUB_WORKSPACE/artifacts/runner-readiness-next-twenty-project-pass"
          python -B "$GITHUB_WORKSPACE/scripts/acceptance/next20_acquire.py" percol
          SOURCE_DIR="$GITHUB_WORKSPACE/artifacts/runner-readiness-next-twenty-project-pass/active/percol/src"
          cp -a "$SOURCE_DIR" percol-source
          cp "$GITHUB_WORKSPACE/artifacts/runner-readiness-next-twenty-project-pass/active/percol/acquisition.json" acquisition.json
          cp "$GITHUB_WORKSPACE/artifacts/runner-readiness-next-twenty-project-pass/active/percol/source.tar.gz" percol.tar.gz
          PERCOL_SHA=$(python -c 'import json; print(json.load(open("acquisition.json"))["archive_sha256"])')
          test "$(python -c 'import json; print(json.load(open("acquisition.json"))["pin"])')" = "$PERCOL_PIN"
          test -f percol-source/debian/copyright
          grep -qi 'License: MIT' percol-source/debian/copyright

          PYTHON_URL=https://www.python.org/ftp/python/2.7.18
          curl --fail --location --retry 3 --max-time 90 "$PYTHON_URL/Python-2.7.18.tgz" -o Python-2.7.18.tgz
          curl --fail --location --retry 3 --max-time 90 "$PYTHON_URL/Python-2.7.18.tgz.asc" -o Python-2.7.18.tgz.asc
          curl --fail --location --retry 3 --max-time 90 \
            'https://keybase.io/bp/pgp_keys.asc?fingerprint=c01e1cad5ea2c4f0b8e3571504c367c218add4ff' \
            -o python-release-key-current.asc
          gpg --batch --import python-release-key-current.asc
          FINGERPRINTS=$(gpg --with-colons --list-keys | awk -F: '$1 == "fpr" {print toupper($10)}')
          printf '%s\n' "$FINGERPRINTS" | grep -qx C01E1CAD5EA2C4F0B8E3571504C367C218ADD4FF
          gpg --list-packets Python-2.7.18.tgz.asc | tee python-source-signature-packets.txt
          gpg --batch --verify Python-2.7.18.tgz.asc Python-2.7.18.tgz
          PY_SHA=$(shasum -a 256 Python-2.7.18.tgz | awk '{print $1}')

          mkdir wheelhouse
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: \
            --dest wheelhouse six==1.16.0
          cp wheelhouse/six-1.16.0-py2.py3-none-any.whl six.whl
          SIX_SHA=$(shasum -a 256 six.whl | awk '{print $1}')
          test "$SIX_SHA" = 8abb2f1d86890a2dfb989f9a77cfcfd3e47c2a354b01111771326f8aa26e0254
          mkdir six-site
          unzip -q six.whl -d six-site

          PY_SOURCE_DIR="$RUNNER_TEMP/percol-feasibility/python-source"
          PYTHON_BUILD_FILESYSTEM=host-default
          if [[ "$RUNNER_OS" == macOS ]]; then
            PYTHON_BUILD_ROOT="$RUNNER_TEMP/percol-case-sensitive"
            PYTHON_BUILD_IMAGE="$RUNNER_TEMP/percol-case-sensitive.sparseimage"
            mkdir -p "$PYTHON_BUILD_ROOT"
            hdiutil create -size 2g -type SPARSE -fs HFSX -volname percol-cs "$PYTHON_BUILD_IMAGE"
            hdiutil attach -nobrowse -mountpoint "$PYTHON_BUILD_ROOT" "$PYTHON_BUILD_IMAGE"
            diskutil info "$PYTHON_BUILD_ROOT" | tee "$RUNNER_TEMP/percol-feasibility/case-sensitive-filesystem.txt"
            grep -qi 'Case-sensitive' "$RUNNER_TEMP/percol-feasibility/case-sensitive-filesystem.txt"
            PY_SOURCE_DIR="$PYTHON_BUILD_ROOT/python-source"
            PYTHON_BUILD_FILESYSTEM=case-sensitive-hfs-plus
          fi
          mkdir "$PY_SOURCE_DIR"
          tar -xzf Python-2.7.18.tgz -C "$PY_SOURCE_DIR" --strip-components=1
          PYTHON_BUILD_PATCH=none
          if [[ "$RUNNER_OS" == macOS ]]; then
            python - "$PY_SOURCE_DIR/configure" "$RUNNER_TEMP/percol-feasibility/python-configure-arm64.patch" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          start = text.index("    else\n    \tcase `/usr/bin/arch` in")
          wildcard = text.index("    \t*)", start)
          insertion = "    \tarm64)\n    \t\tMACOSX_DEFAULT_ARCH=\"arm64\"\n    \t\t;;\n"
          if "arm64)\n    \t\tMACOSX_DEFAULT_ARCH=\"arm64\"" in text:
              raise SystemExit("refusing to apply duplicate native arm64 configure patch")
          path.write_text(text[:wildcard] + insertion + text[wildcard:])
          Path(sys.argv[2]).write_text(
              "CPython 2.7.18 generated configure compatibility patch for native Apple Silicon.\n"
              "Adds arm64 to the native macOS architecture case; no cross-compilation or target source change.\n")
          PY
            PYTHON_BUILD_PATCH=configure-arm64
          fi
          cd "$PY_SOURCE_DIR"
          ./configure --prefix="$RUNNER_TEMP/percol-feasibility/python" --with-ensurepip=no
          make -j2
          PYTHON="$PY_SOURCE_DIR/python"
          cd "$RUNNER_TEMP/percol-feasibility"
          PYTHONPATH="$PWD/percol-source:$PWD/six-site" "$PYTHON" -c 'import sys, six, percol; assert sys.version_info[:3] == (2, 7, 18); print("CPython", sys.version.split()[0]); print("six", six.__version__); print("Percol import", percol.__file__)'
          cp "$PY_SOURCE_DIR/configure" python-source-configure
          cp "$PY_SOURCE_DIR/config.log" python-source-config.log
          {
            echo "host=$RUNNER_OS/$RUNNER_ARCH"
            echo "percol_pin=$PERCOL_PIN"
            echo "percol_archive_sha256=$PERCOL_SHA"
            echo "python_source_signature=verified"
            echo "python_source_sha256=$PY_SHA"
            echo "python_source_signer_fingerprints=$(printf '%s' "$FINGERPRINTS" | paste -sd, -)"
            echo "six_version=1.16.0"
            echo "six_wheel_sha256=$SIX_SHA"
            echo "percol_import=passed"
            echo "python_build_patch=$PYTHON_BUILD_PATCH"
            echo "python_build_filesystem=$PYTHON_BUILD_FILESYSTEM"
            if [[ -f python-configure-arm64.patch ]]; then
              echo "python_build_patch_sha256=$(shasum -a 256 python-configure-arm64.patch | awk '{print $1}')"
            fi
            echo "qualification_scope=source/runtime feasibility only; no PTY scenario or admission credit"
          } | tee feasibility.txt

      - name: Preserve Mac build metadata and detach case-sensitive APFS volume
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ROOT="$RUNNER_TEMP/percol-case-sensitive"
          EVIDENCE="$RUNNER_TEMP/percol-feasibility"
          if [[ -f "$BUILD_ROOT/python-source/configure" ]]; then
            cp "$BUILD_ROOT/python-source/configure" "$EVIDENCE/python-source-configure"
          fi
          if [[ -f "$BUILD_ROOT/python-source/config.log" ]]; then
            cp "$BUILD_ROOT/python-source/config.log" "$EVIDENCE/python-source-config.log"
          fi
          if [[ -f "$EVIDENCE/python-configure-arm64.patch" ]]; then
            shasum -a 256 "$EVIDENCE/python-configure-arm64.patch" > "$EVIDENCE/python-configure-arm64.patch.sha256"
          fi
          if hdiutil info | grep -Fq "$BUILD_ROOT"; then
            hdiutil detach "$BUILD_ROOT"
            echo "case_sensitive_apfs_detached=true"
          else
            echo "case_sensitive_apfs_detached=not_mounted"
          fi

      - name: Preserve feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: percol-feasibility-${{ matrix.os }}
          path: ${{ runner.temp }}/percol-feasibility
          if-no-files-found: warn
          retention-days: 30
