name: Runner readiness private provisional candidate
on:
  push:
    branches: [work/p0-p2-implementation]
    paths: ['.github/workflows/runner-readiness-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_REVISION: 129b7a45c0006be550f798ce52c2fbbfd327e515
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  GOTOOLCHAIN: local
concurrency:
  group: playtestr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terminal:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Wyrcan-io/playtestr
          ref: 129b7a45c0006be550f798ce52c2fbbfd327e515
          path: .playtestr-tooling
          persist-credentials: false
          set-safe-directory: false
      - name: Owned official SDK and caches
        run: |
          campaign="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass"
          mkdir -p "$campaign/tmp" "$campaign/go-cache" "$campaign/gopath"
          export TEMP="$campaign/tmp" TMP="$campaign/tmp" TMPDIR="$campaign/tmp" GOTMPDIR="$campaign/tmp"
          export GOCACHE="$campaign/go-cache" GOPATH="$campaign/gopath" GOMODCACHE="$campaign/gopath/pkg/mod"
          for name in TEMP TMP TMPDIR GOTMPDIR GOCACHE GOPATH GOMODCACHE; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          python scripts/acceptance/readiness_check.py --label candidate-native-sdk --timeout 360 -- python scripts/acceptance/readiness_bootstrap_go.py
          echo "$campaign/toolchain/go/bin" >> "$GITHUB_PATH"
      - name: Build and verify exact private native archive after native migration repair validation
        run: python scripts/acceptance/readiness_check.py --label provisional-private-native-package --timeout 600 -- python scripts/acceptance/readiness_candidate_package.py --series migration-v2
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: private-candidate-${{ runner.os }}
          path: |
            artifacts/runner-readiness-ten-project-pass/events/
            artifacts/runner-readiness-ten-project-pass/identities/
            artifacts/runner-readiness-ten-project-pass/core/
            artifacts/runner-readiness-ten-project-pass/candidate-packages/migration-v2/*/dist/
            artifacts/runner-readiness-ten-project-pass/candidate-packages/migration-v2/*/candidate.json
            artifacts/runner-readiness-ten-project-pass/toolchain/sdk.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
