name: Runner readiness fff native
on:
  push:
    branches: [work/p0-p2-implementation]
    paths: ['.github/workflows/runner-readiness-fff.yml']
  workflow_dispatch:
    inputs:
      hosts:
        type: choice
        default: both
        options: [both, linux, macos]
        description: Native hosts for source-reviewed first use
permissions:
  contents: read
env:
  SOURCE_REVISION: e7b5f29e575e44babe7fdaa2e83e55b62d318305
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  GOTOOLCHAIN: local
concurrency:
  group: playtestr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terminal:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: ${{ fromJSON(inputs.hosts == 'linux' && '["ubuntu-24.04"]' || inputs.hosts == 'macos' && '["macos-15"]' || '["ubuntu-24.04", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Wyrcan-io/playtestr
          ref: e7b5f29e575e44babe7fdaa2e83e55b62d318305
          path: .playtestr-tooling
          persist-credentials: false
          set-safe-directory: false
      - name: Owned official SDK and caches
        run: |
          campaign="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass"
          mkdir -p "$campaign/tmp" "$campaign/go-cache" "$campaign/gopath"
          export TEMP="$campaign/tmp" TMP="$campaign/tmp" TMPDIR="$campaign/tmp" GOTMPDIR="$campaign/tmp"
          export GOCACHE="$campaign/go-cache" GOPATH="$campaign/gopath" GOMODCACHE="$campaign/gopath/pkg/mod"
          for name in TEMP TMP TMPDIR GOTMPDIR GOCACHE GOPATH GOMODCACHE; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          python3 scripts/acceptance/readiness_check.py --label fff-native-sdk --timeout 360 -- python3 scripts/acceptance/readiness_bootstrap_go.py
          echo "$campaign/toolchain/go/bin" >> "$GITHUB_PATH"
      - name: Build exact source candidate with prelaunch evidence
        run: |
          mkdir -p .playtestr-bin
          python3 scripts/acceptance/readiness_check.py --label fff-candidate-build --timeout 180 -- go -C .playtestr-tooling build -trimpath -ldflags "-X github.com/Wyrcan-io/playtestr/internal/buildinfo.Version=source-$SOURCE_REVISION" -o "$GITHUB_WORKSPACE/.playtestr-bin/playtestr" ./cmd/playtestr
          test "$(.playtestr-bin/playtestr --version)" = "playtestr source-$SOURCE_REVISION"
      - name: Reviewed installed native Bash setup
        id: prepare
        run: python3 scripts/acceptance/readiness_vis_native_prepare.py
      - name: First public recording, explicit review and ordinary replay
        run: |
          python3 scripts/acceptance/readiness_check.py --label native-fff-first-public-route --timeout 600 -- python3 scripts/acceptance/readiness_vis_first_use.py
      - name: Verify pinned source restores and owned runtime termination
        if: always() && steps.prepare.outcome == 'success'
        run: |
          python3 scripts/acceptance/readiness_check.py --label native-fff-source-cleanup --timeout 120 -- python3 scripts/acceptance/readiness_cleanup_plop.py --project fff
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: playtestr-${{ runner.os }}
          path: |
            artifacts/runner-readiness-ten-project-pass/events/
            artifacts/runner-readiness-ten-project-pass/identities/
            artifacts/runner-readiness-ten-project-pass/core/
            artifacts/runner-readiness-ten-project-pass/fff/
            artifacts/runner-readiness-ten-project-pass/fff-native-runner.json
            artifacts/runner-readiness-ten-project-pass/fff-runtime-baseline.json
            artifacts/runner-readiness-ten-project-pass/toolchain/sdk.json
            !artifacts/runner-readiness-ten-project-pass/fff/retained-source/source.tar.gz
          if-no-files-found: error
          retention-days: 14
