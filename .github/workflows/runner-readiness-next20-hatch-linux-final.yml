name: Next twenty Hatch native Linux final qualification
on:
  push:
    branches: [work/p0-p2-implementation]
    paths: ['.github/workflows/runner-readiness-next20-hatch-linux-final.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: playtestr-next20-hatch-linux-final
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  TEMP: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp
  TMP: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp
  TMPDIR: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp
jobs:
  native-final:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Create owned temporary paths
        run: mkdir -p "$GITHUB_WORKSPACE/artifacts/runner-readiness-next-twenty-project-pass/tmp"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: Wyrcan-io/playtestr
          run-id: 40424475362
          name: next20-private-replacement-Linux
          path: artifacts/runner-readiness-next-twenty-project-pass/candidate-download
      - name: Install the exact frozen native archive
        run: python -B scripts/acceptance/next20_check.py --label hatch-linux-exact-native-archive --timeout 90 -- python -B scripts/acceptance/next20_candidate_install.py --series native-exit-v1 --archive artifacts/runner-readiness-next-twenty-project-pass/candidate-download/replacement-candidate/native-exit-v1/linux-amd64/dist/playtestr_0.4.0-rc.6_linux_amd64.tar.gz
      - name: Prepare reviewed pinned source and exact Linux wheels
        id: prepare
        run: python -B scripts/acceptance/next20_check.py --label hatch-linux-bounded-native-preparation --timeout 1200 -- python -B scripts/acceptance/next20_jrnl_native_prepare.py --project hatch
      - name: Execute twelve fresh final batches and three source faults
        env:
          READINESS_EVIDENCE_PHASE: final-archive
        run: python -B scripts/acceptance/next20_check.py --label hatch-linux-final-twelve-batches-and-faults --timeout 1200 -- python -B scripts/acceptance/next20_hatch_final_series.py
      - name: Retain exact inputs and confirm native source/runtime cleanup
        if: always() && steps.prepare.outcome == 'success'
        run: python -B scripts/acceptance/next20_check.py --label hatch-linux-source-runtime-removal --timeout 180 -- python -B scripts/acceptance/next20_target_cleanup.py --project hatch --generated-source-manifest artifacts/runner-readiness-next-twenty-project-pass/hatch/native-generated-source.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: next20-hatch-linux-final
          path: |
            artifacts/runner-readiness-next-twenty-project-pass/core/
            artifacts/runner-readiness-next-twenty-project-pass/events/
            artifacts/runner-readiness-next-twenty-project-pass/identities/
            artifacts/runner-readiness-next-twenty-project-pass/hatch/
            artifacts/runner-readiness-next-twenty-project-pass/active/hatch/*.json
            artifacts/runner-readiness-next-twenty-project-pass/active/hatch/source.tar.gz
            artifacts/runner-readiness-next-twenty-project-pass/candidate-native-exit-v1/linux/installed.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
