name: Runner readiness core

on:
  push:
    branches: [work/p0-p2-implementation]
    paths:
      - '.github/workflows/runner-readiness.yml'
      - 'internal/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'schema/**'
      - 'setup-playtestr/**'
      - 'scripts/ci/**'
      - 'scripts/acceptance/readiness_*.py'
      - 'scripts/acceptance/test_readiness_*.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'

jobs:
  native-core:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Native tests, race checks and public saved-state calibration
        shell: bash
        run: |
          set -euo pipefail
          campaign="$GITHUB_WORKSPACE/artifacts/runner-readiness-ten-project-pass"
          mkdir -p "$campaign/tmp" "$campaign/go-cache" "$campaign/gopath"
          export TEMP="$campaign/tmp" TMP="$campaign/tmp" TMPDIR="$campaign/tmp" GOTMPDIR="$campaign/tmp"
          export GOCACHE="$campaign/go-cache" GOPATH="$campaign/gopath" GOMODCACHE="$campaign/gopath/pkg/mod"
          export GOTOOLCHAIN=local PYTHONIOENCODING=utf-8 PYTHONDONTWRITEBYTECODE=1
          if command -v python3 >/dev/null 2>&1; then py=python3; else py=python; fi
          "$py" scripts/acceptance/readiness_check.py --label workspace-sdk-bootstrap --timeout 360 -- "$py" scripts/acceptance/readiness_bootstrap_go.py
          export PATH="$campaign/toolchain/go/bin:$PATH"
          if [ "$RUNNER_OS" = Windows ]; then
            export PATH="/c/msys64/mingw64/bin:/c/msys64/ucrt64/bin:$PATH"
            export CC=gcc
          fi
          go version
          "$py" --version
          checks_failed=0
          check() {
            if ! "$py" scripts/acceptance/readiness_check.py "$@"; then checks_failed=1; fi
          }
          check --label native-core-tests --timeout 600 -- go test -json -count=1 ./...
          check --label native-vet --timeout 180 -- go vet ./...
          export CGO_ENABLED=1
          check --label native-race --timeout 600 -- go test -race -json -count=1 ./...
          check --label native-evidence-controls --timeout 120 -- "$py" -m unittest discover -s scripts/acceptance -p test_readiness_evidence.py -v
          check --label native-ci-summary-controls --timeout 120 -- "$py" -m unittest discover -s scripts/ci -p test_report_summary.py -v
          check --label native-public-state-parent --timeout 300 -- "$py" scripts/acceptance/readiness_state_journey.py
          exit "$checks_failed"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: runner-readiness-core-${{ matrix.os }}
          path: |
            artifacts/runner-readiness-ten-project-pass/events/
            artifacts/runner-readiness-ten-project-pass/identities/
            artifacts/runner-readiness-ten-project-pass/core/
            artifacts/runner-readiness-ten-project-pass/state-calibration/
            artifacts/runner-readiness-ten-project-pass/public route*/
            artifacts/runner-readiness-ten-project-pass/toolchain/sdk.json
          if-no-files-found: error
          retention-days: 14
