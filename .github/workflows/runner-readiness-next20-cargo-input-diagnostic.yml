name: Next twenty cargo-generate native input diagnosis
on:
  push:
    branches: [work/p0-p2-implementation]
    paths: ['.github/workflows/runner-readiness-next20-cargo-input-diagnostic.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [raw-pty, candidate-trace]
        default: raw-pty
      selected_case:
        type: choice
        options: [N01, E02]
        default: N01
permissions:
  contents: read
  actions: read
concurrency:
  group: playtestr-next20-cargo-input-diagnostic
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  TEMP: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp
  TMP: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp
  TMPDIR: ${{ github.workspace }}/artifacts/runner-readiness-next-twenty-project-pass/tmp
jobs:
  input-diagnosis:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Create owned temporary directory
        run: mkdir -p "$GITHUB_WORKSPACE/artifacts/runner-readiness-next-twenty-project-pass/tmp"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: Wyrcan-io/playtestr
          run-id: 40467049451
          name: next20-cargo-linux-preflight
          path: artifacts/runner-readiness-next-twenty-project-pass/diagnostic-native-input
      - name: Capture bounded real PTY input and termios observations
        if: inputs.mode == 'raw-pty'
        run: python -B scripts/acceptance/next20_check.py --label cargo-native-real-pty-input-diagnosis --timeout 180 -- python -B scripts/acceptance/next20_cargo_input_diagnostic.py --packet artifacts/runner-readiness-next-twenty-project-pass/diagnostic-native-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.mode == 'candidate-trace'
        with:
          github-token: ${{ github.token }}
          repository: Wyrcan-io/playtestr
          run-id: 40424475362
          name: next20-private-replacement-Linux
          path: artifacts/runner-readiness-next-twenty-project-pass/candidate-download
      - name: Install exact frozen archive for actual candidate tracing
        if: inputs.mode == 'candidate-trace'
        run: python -B scripts/acceptance/next20_check.py --label cargo-linux-diagnostic-exact-archive --timeout 60 -- python -B scripts/acceptance/next20_candidate_install.py --series native-exit-v1 --archive artifacts/runner-readiness-next-twenty-project-pass/candidate-download/replacement-candidate/native-exit-v1/linux-amd64/dist/playtestr_0.4.0-rc.6_linux_amd64.tar.gz
      - name: Trace actual frozen candidate input and output syscalls
        if: inputs.mode == 'candidate-trace'
        env:
          SELECTED_CASE: ${{ inputs.selected_case }}
        run: python -B scripts/acceptance/next20_check.py --label cargo-exact-candidate-pty-input-trace --timeout 240 -- python -B scripts/acceptance/next20_cargo_candidate_input_trace.py --packet artifacts/runner-readiness-next-twenty-project-pass/diagnostic-native-input --case "$SELECTED_CASE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: next20-cargo-native-input-diagnostic
          path: |
            artifacts/runner-readiness-next-twenty-project-pass/core/
            artifacts/runner-readiness-next-twenty-project-pass/events/
            artifacts/runner-readiness-next-twenty-project-pass/identities/
            artifacts/runner-readiness-next-twenty-project-pass/cargo-generate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
