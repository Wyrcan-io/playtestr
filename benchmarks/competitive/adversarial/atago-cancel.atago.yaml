version: "1"
suite: {name: Competitive adversarial cancellation}
scenarios:
  - name: interrupt a ready target
    steps:
      - pty:
          command: "${env:ADVERSARIAL_BIN} hang"
          shell: true
          timeout: 5s
          session:
            - expect: "adversarial ready"
            - signal: INT
            - expect: "cancelled by signal"
      - assert: {exit_code: 130}
