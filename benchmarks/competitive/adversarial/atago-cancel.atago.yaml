version: "1"
suite: {name: Competitive adversarial cancellation}
scenarios:
  - name: interrupt a ready target
    services:
      - name: target
        command: "${env:ADVERSARIAL_BIN} hang"
        shell: true
        ready:
          log: "adversarial ready"
    steps:
      - signal:
          service: target
          signal: INT
          wait:
            timeout: 5s
